<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>美股基金估值</title>
  <style>
    /* ── Theme variables ── */
    :root {
      --bg: #111;
      --bg-secondary: #1a1e2c;
      --bg-card: transparent;
      --bg-active: #181818;
      --bg-badge: #202020;
      --bg-entry: linear-gradient(180deg, #181c28 0%, #14172a 100%);
      --bg-header: radial-gradient(ellipse at 50% 0%, rgba(56, 76, 120, 0.35) 0%, transparent 70%), linear-gradient(180deg, #1a1e2c 0%, #14172040 60%, #11111100 100%);
      --bg-vixy: linear-gradient(180deg, #1a1e2c 0%, #141720 100%);
      --text-primary: #e8e8e8;
      --text-name: #d8d8d8;
      --text-holding: #e0e0e0;
      --text-weight: #d0d0d0;
      --text-secondary: #8088a0;
      --text-muted: #555;
      --text-footer: #333;
      --text-status: #505050;
      --text-status-mkt: #686868;
      --border: #181818;
      --border-header: #232838;
      --border-detail: #1e1e1e;
      --border-badge: #2a2a2a;
      --border-entry: #262c40;
      --shadow-header: 0 1px 0 rgba(255,255,255,0.04) inset, 0 2px 6px rgba(0,0,0,0.4);
      --header-line: linear-gradient(90deg, transparent 0%, #2a3045 50%, transparent 100%);
      --spinner-border: #2a2a2a;
      --spinner-top: #555;
      --btn-bg: #1e1e1e;
      --btn-border: #333;
      --btn-color: #888;
      --btn-active: #2a2a2a;
      --back-btn: #aaa;
      --back-btn-active: #fff;
      --detail-title: #f0f0f0;
      --detail-code: #666;
      --est-label: #888;
      --table-head: #7a7a7a;
      --chevron: #444;
      --dot-bg: #444;
      --entry-label: #e8e8e8;
      --entry-sub: #6a7080;
      --flash-up-start: rgba(240, 82, 42, 0.32);
      --flash-up-mid: rgba(240, 82, 42, 0.22);
      --flash-down-start: rgba(26, 173, 79, 0.30);
      --flash-down-mid: rgba(26, 173, 79, 0.20);
      --up: #e84c3d;
      --down: #2ebd85;
      --flat: #666;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f6f8;
        --bg-secondary: #ffffff;
        --bg-card: #ffffff;
        --bg-active: #f0f1f3;
        --bg-badge: #f0f1f4;
        --bg-entry: linear-gradient(180deg, #ffffff 0%, #f8f9fc 100%);
        --bg-header: linear-gradient(180deg, #ffffff 0%, #f5f7fa 100%);
        --bg-vixy: linear-gradient(180deg, #ffffff 0%, #f8f9fc 100%);
        --text-primary: #1a1a1a;
        --text-name: #222222;
        --text-holding: #1a1a1a;
        --text-weight: #444444;
        --text-secondary: #6b7280;
        --text-muted: #9ca3af;
        --text-footer: #9ca3af;
        --text-status: #9ca3af;
        --text-status-mkt: #6b7280;
        --border: #eef0f3;
        --border-header: #e5e7eb;
        --border-detail: #eef0f3;
        --border-badge: #e5e7eb;
        --border-entry: #e5e7eb;
        --shadow-header: 0 1px 3px rgba(0,0,0,0.06);
        --header-line: linear-gradient(90deg, transparent 0%, #e5e7eb 50%, transparent 100%);
        --spinner-border: #e5e7eb;
        --spinner-top: #9ca3af;
        --btn-bg: #ffffff;
        --btn-border: #e5e7eb;
        --btn-color: #6b7280;
        --btn-active: #f0f1f3;
        --back-btn: #6b7280;
        --back-btn-active: #1a1a1a;
        --detail-title: #1a1a1a;
        --detail-code: #9ca3af;
        --est-label: #9ca3af;
        --table-head: #9ca3af;
        --chevron: #d1d5db;
        --dot-bg: #d1d5db;
        --entry-label: #1a1a1a;
        --entry-sub: #6b7280;
        --flash-up-start: rgba(240, 82, 42, 0.15);
        --flash-up-mid: rgba(240, 82, 42, 0.08);
        --flash-down-start: rgba(26, 173, 79, 0.15);
        --flash-down-mid: rgba(26, 173, 79, 0.08);
        --up: #e84c3d;
        --down: #2ebd85;
        --flat: #9ca3af;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* ── Header (list view) ── */
    .header {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      padding: 12px 6px 10px;
      gap: 2px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-header);
      box-shadow: var(--shadow-header);
      position: relative;
    }
    .header::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: -1px;
      height: 1px;
      background: var(--header-line);
    }
    .h-item {
      text-align: center;
      min-width: 0;
      padding: 4px 2px;
      border-radius: 6px;
      transition: background 0.4s ease-out;
    }
    .h-item.flash-up   { background: rgba(204, 41, 41, 0.25); }
    .h-item.flash-down { background: rgba(13, 140, 66, 0.25); }
    .h-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .h-price { font-size: 15px; font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; }
    .h-val   { font-size: 18px; font-weight: 700; letter-spacing: -0.4px; font-variant-numeric: tabular-nums; }

    /* ── VIXY 恐慌指标栏 ── */
    .vixy-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 12px;
      background: var(--bg-vixy);
      border-bottom: 1px solid var(--border-header);
    }
    .vixy-bar .vixy-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .vixy-bar .vixy-price {
      font-size: 19px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .vixy-bar .vixy-label {
      font-size: 12px;
      color: var(--text-secondary);
    }
    .vixy-bar .vixy-chg {
      font-size: 13px;
      font-weight: 600;
    }
    .vixy-bar .vixy-signal {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .vixy-bar .vixy-action {
      margin-top: 5px;
      text-align: center;
    }
    .vixy-bar .alert-amount {
      font-size: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .vixy-bar .alert-tip {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      font-weight: 400;
      opacity: 0.8;
    }
    .vixy-signal.signal-normal {
      color: var(--text-secondary);
      background: rgba(128,136,160,0.12);
    }
    .vixy-signal.signal-watch {
      color: #5ba8d6;
      background: rgba(91,168,214,0.15);
    }
    .vixy-signal.signal-panic {
      color: #e6a700;
      background: rgba(230,167,0,0.15);
    }
    .vixy-signal.signal-buy {
      color: #f0522a;
      background: rgba(240,82,42,0.18);
    }
    .vixy-signal.signal-heavy {
      color: #ff2d2d;
      background: rgba(255,45,45,0.22);
      animation: pulse-signal 1.2s ease-in-out infinite;
    }
    @keyframes pulse-signal {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* ── VIXY 加仓提醒等级 ── */
    .vixy-bar.alert-watch {
      background: linear-gradient(180deg, rgba(224,160,48,0.18) 0%, rgba(224,160,48,0.06) 100%);
      border-top: 2px solid rgba(224,160,48,0.5);
    }
    .vixy-bar.alert-watch .alert-amount { color: #e0a030; }
    .vixy-bar.alert-buy {
      background: linear-gradient(180deg, rgba(240,82,42,0.22) 0%, rgba(240,82,42,0.08) 100%);
      border-top: 2px solid rgba(240,82,42,0.6);
    }
    .vixy-bar.alert-buy .alert-amount { color: #ff6b35; }
    .vixy-bar.alert-add {
      background: linear-gradient(180deg, rgba(255,45,45,0.25) 0%, rgba(255,45,45,0.10) 100%);
      border-top: 2px solid rgba(255,45,45,0.7);
    }
    .vixy-bar.alert-add .alert-amount { color: #ff4040; }
    .vixy-bar.alert-full {
      background: linear-gradient(180deg, rgba(255,30,30,0.30) 0%, rgba(255,30,30,0.12) 100%);
      border-top: 3px solid rgba(255,30,30,0.9);
      animation: alert-glow 1.2s ease-in-out infinite;
    }
    .vixy-bar.alert-full .alert-amount { color: #ff2020; }
    @keyframes alert-glow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }

    .status-bar {
      text-align: center;
      padding: 6px 12px;
      font-size: 13px;
      color: var(--text-status);
      border-bottom: 1px solid var(--border);
      line-height: 1.6;
    }
    .status-bar .mkt { color: var(--text-status-mkt); }

    /* ── Fund list ── */
    .fund-item {
      display: flex;
      align-items: center;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      background-color: var(--bg-card);
      cursor: pointer;
      position: relative;
      transition: background-color 0.18s ease-out;
    }
    .fund-item:active { background-color: var(--bg-active); }

    /* Futu-style price-change flash */
    @keyframes fund-flash-up {
      0%   { background-color: rgba(232, 76, 61, 0.18); }
      100% { background-color: var(--bg-card); }
    }
    @keyframes fund-flash-down {
      0%   { background-color: rgba(46, 189, 133, 0.18); }
      100% { background-color: var(--bg-card); }
    }
    .fund-item.flash-up   { animation: fund-flash-up 1s ease-out; }
    .fund-item.flash-down { animation: fund-flash-down 1s ease-out; }

    .fund-left { flex: 1; display: flex; align-items: center; gap: 7px; min-width: 0; }
    .fund-name { font-size: 14px; color: var(--text-name); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fund-code { font-size: 13px; color: var(--text-muted); font-variant-numeric: tabular-nums; letter-spacing: 0.4px; flex-shrink: 0; }
    .badge {
      flex-shrink: 0;
      font-size: 11px;
      padding: 1px 4px;
      border-radius: 3px;
      background: var(--bg-badge);
      color: var(--text-muted);
      border: 1px solid var(--border-badge);
    }
    .fund-pct {
      font-size: 13px;
      font-weight: 400;
      min-width: 72px;
      text-align: center;
      letter-spacing: -0.2px;
      font-variant-numeric: tabular-nums;
      padding: 4px 8px;
      border-radius: 3px;
      color: #fff;
    }
    .fund-pct.up   { background: #f23a2f; color: #fff; }
    .fund-pct.down { background: #33c85a; color: #fff; }
    .fund-pct.flat { background: var(--bg-active); color: var(--flat); }
    .chevron { color: var(--chevron); font-size: 16px; margin-left: 6px; }

    /* Chinese convention: red = up, green = down */
    .up   { color: var(--up); }
    .down { color: var(--down); }
    .flat { color: var(--flat); }

    /* ── Detail view ── */
    .detail-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 14px 10px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-detail);
    }
    .back-btn {
      background: transparent; border: none; color: var(--back-btn);
      font-size: 17px; cursor: pointer; padding: 4px 8px 4px 0;
      display: flex; align-items: center; gap: 4px;
    }
    .back-btn:active { color: var(--back-btn-active); }
    .h24-topbar { padding: 10px 14px 0; background: var(--bg-header); }
    .detail-title { font-size: 16px; font-weight: 600; color: var(--detail-title); flex: 1; text-align: center; margin: 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.3; }
    .detail-est { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 100px; text-align: right; }
    .detail-est .est-label { color: var(--est-label); font-weight: 400; font-size: 12px; margin-right: 4px; }

    .table-head {
      display: grid;
      grid-template-columns: 1fr 80px 90px;
      padding: 9px 12px 7px;
      font-size: 12px;
      color: var(--table-head);
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
    }
    .table-head .col-pct { text-align: right; padding-right: 12px; }
    .table-head .col-chg { text-align: right; }

    .holding-row {
      display: grid;
      grid-template-columns: 1fr 80px 90px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
      align-items: center;
    }
    .holding-name { font-size: 14px; color: var(--text-holding); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .holding-mkt-tag { font-size: 11px; color: var(--text-muted); margin-left: 4px; padding: 1px 3px; border: 1px solid var(--border-badge); border-radius: 2px; }
    .holding-weight { text-align: right; padding-right: 10px; font-size: 14px; color: var(--text-weight); font-variant-numeric: tabular-nums; }
    .holding-chg { text-align: right; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }

    .detail-footnote {
      text-align: center;
      padding: 18px 14px 30px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
    }

    /* ── Loading / Error ── */
    .center-msg {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 200px; color: var(--text-muted); font-size: 15px; gap: 12px;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--spinner-border); border-top-color: var(--spinner-top); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .retry-btn {
      padding: 7px 18px; background: var(--btn-bg); border: 1px solid var(--btn-border);
      color: var(--btn-color); border-radius: 5px; cursor: pointer; font-size: 14px;
    }
    .retry-btn:active { background: var(--btn-active); }

    .footer {
      text-align: center; padding: 20px 16px 30px; font-size: 13px; color: var(--text-footer);
    }

    /* ── 24h entry card ── */
    .entry-row {
      display: flex;
      align-items: center;
      margin: 18px 14px 6px;
      padding: 14px 16px;
      background: var(--bg-entry);
      border: 1px solid var(--border-entry);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.18s ease-out, border-color 0.18s ease-out;
    }
    .entry-row:active { border-color: var(--text-secondary); }
    .entry-main { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .entry-label { font-size: 16px; color: var(--entry-label); font-weight: 600; letter-spacing: 0.3px; }
    .entry-sub { font-size: 13px; color: var(--entry-sub); }
    .entry-row .chevron { color: var(--entry-sub); font-size: 18px; margin-left: 8px; }

    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--dot-bg); margin-left: 4px; vertical-align: middle; }
    .dot.live { background: #27ae60; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* ── Sort & Pin ── */
    .list-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 7px 30px 7px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
    }
    .sort-header {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .sort-header:active { opacity: 0.6; }
    .sort-header.active { color: var(--text-name); }
    .sort-arrows {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      line-height: 0.72;
      font-size: 9px;
    }
    .sort-arrows .arr { color: var(--flat); }
    .sort-arrows .arr.on { color: var(--up); }
    .pin-icon {
      margin-right: 4px;
      cursor: pointer;
      flex-shrink: 0;
      padding: 2px;
      opacity: 0.35;
      transition: opacity 0.15s;
      display: inline-flex;
      align-items: center;
    }
    .pin-icon svg { width: 14px; height: 14px; fill: var(--text-muted); }
    .pin-icon.pinned { opacity: 1; }
    .pin-icon.pinned svg { fill: var(--up); }
    .fund-item.pinned-item { border-bottom-color: var(--border-header); }
    .pin-divider {
      height: 1px;
      background: var(--border-header);
      margin: 0;
    }

    /* ── 均线预警表格 ── */
    .ma-alert-section {
      margin-top: 9px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .ma-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: auto;
    }
    .ma-table-head {
      background: rgba(255,255,255,0.82);
    }
    .ma-table-head th {
      font-size: 10px;
      color: #1a1a1a;
      font-weight: 600;
      padding: 5px 8px;
      text-align: left;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }
    .ma-table tbody tr {
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .ma-table td {
      padding: 6px 8px;
      vertical-align: top;
    }
    /* 左侧色条：lv1绿 lv2红 lv3紫 lv4深橙 */
    .ma-table tr.lv1 { border-left: 3px solid #22c55e; }
    .ma-table tr.lv2 { border-left: 3px solid #ef4444; }
    .ma-table tr.lv3 { border-left: 3px solid #a855f7; }
    .ma-table tr.lv4 { border-left: 3px solid #f97316; }
    /* 等级徽章 */
    .ma-td-badge { width: 56px; white-space: nowrap; }
    .ma-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }
    .ma-badge.lv1 { background: rgba(34,197,94,0.20);  color: #22c55e; border: 1px solid rgba(34,197,94,0.45); }
    .ma-badge.lv2 { background: rgba(239,68,68,0.20);  color: #f87171; border: 1px solid rgba(239,68,68,0.45);
      animation: pulse-signal 1.5s ease-in-out infinite; }
    .ma-badge.lv3 { background: rgba(168,85,247,0.20); color: #c084fc; border: 1px solid rgba(168,85,247,0.45);
      animation: pulse-signal 1.0s ease-in-out infinite; }
    .ma-badge.lv4 { background: rgba(249,115,22,0.20); color: #fb923c; border: 1px solid rgba(249,115,22,0.45);
      animation: pulse-signal 0.8s ease-in-out infinite; }
    /* 涉及指数列：每两个换行 */
    .ma-td-indices { width: 110px; }
    .ma-indices-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
    }
    .ma-idx {
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 3px;
      font-weight: 600;
      white-space: nowrap;
      text-align: center;
    }
    .ma-idx.lv1 { color: #22c55e; background: rgba(34,197,94,0.15);  border: 1px solid rgba(34,197,94,0.35); }
    .ma-idx.lv2 { color: #f87171; background: rgba(239,68,68,0.15);  border: 1px solid rgba(239,68,68,0.35); }
    .ma-idx.lv3 { color: #c084fc; background: rgba(168,85,247,0.15); border: 1px solid rgba(168,85,247,0.35); }
    .ma-idx.lv4 { color: #fb923c; background: rgba(249,115,22,0.15); border: 1px solid rgba(249,115,22,0.35); }
    /* 触发条件列 */
    .ma-td-cond { }
    .ma-td-cond span { font-size: 11px; color: #8899aa; white-space: nowrap; }
    /* 操作建议列 */
    .ma-td-advice { width: 60px; }
    .ma-td-advice span {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0;
      display: inline-block;
      width: 52px;
      white-space: normal;
      word-break: break-all;
      line-height: 1.4;
    }
    .ma-td-advice span.lv1 { color: #22c55e; }
    .ma-td-advice span.lv2 { color: #f87171; }
    .ma-td-advice span.lv3 { color: #c084fc; }
    .ma-td-advice span.lv4 { color: #fb923c; }
    .ma-none {
      font-size: 11px; color: #7888a0;
      padding: 7px 8px; display: block; text-align: center;
    }
    .ma-loading {
      font-size: 11px; color: #7888a0;

    .vixy-chg-link {

    .history-date-range {

<body>
<div id="app"><div class="center-msg"><div class="spinner"></div><span>加载持仓数据…</span></div></div>

<script>
// Fallback Chinese names (used when eastmoney didn't provide one)
const CN_NAME = {
  AAPL: '苹果', MSFT: '微软', NVDA: '英伟达', AMZN: '亚马逊',
  META: 'Meta', GOOGL: '谷歌-A', GOOG: '谷歌-C',
  TSLA: '特斯拉', AVGO: '博通', COST: '好市多', NFLX: '奈飞',
  AMD: 'AMD', INTC: '英特尔', CRM: 'Salesforce', ORCL: '甲骨文',
  AMAT: '应用材料', QCOM: '高通', LRCX: '泛林集团', KLAC: '科磊',
  TXN: '德州仪器', ADI: '亚德诺', ADBE: '奥多比',
  TSM: '台积电', NIO: '蔚来', LI: '理想汽车', XPEV: '小鹏汽车',
  RIVN: 'Rivian', F: '福特', GM: '通用汽车', ON: '安森美',
  SNAP: 'Snap', UBER: '优步', PINS: 'Pinterest',
  MRVL: '迈威尔科技', 'USDCNY=X': 'USD/CNY',
};

// Eastmoney market id → label / Sina prefix
//   105 NASDAQ   106 NYSE   107 NYSE-Arca/AMEX   116 HK
//   0 SZ A-share   1 SH A-share
//   KR (synthetic)  Korean KRX, fetched via Naver Finance
const COVERED_MARKETS = new Set(['105', '106', '107', '116', '0', '1', 'KR']);
const CNY_MARKETS     = new Set(['0', '1']);  // A-shares are already in CNY
function isCovered(h) { return COVERED_MARKETS.has(String(h.market)); }
function isCnyHolding(h) { return CNY_MARKETS.has(String(h.market)); }
// Backward alias so other code still reads cleanly
function isUSHolding(h) { return isCovered(h); }
function marketTag(m) {
  m = String(m);
  if (m === '116') return '港股';
  if (m === '0') return 'A股·深';
  if (m === '1') return 'A股·沪';
  if (m === 'KR') return '韩股';
  return '';
}

// Globals populated from /api/funds
let FUNDS = [];          // [{ name, code, reportDate, totalCount, holdings:[{s,w,name_cn,market}], usCoveredWeight }]
let LAST_MAP = {};       // symbol → quote
let LAST_STALE = false;
let timer = null;
let expanded = false;

// Sort & Pin state
let sortMode = 'default';  // 'default' | 'desc' | 'asc'
const pinnedSet = new Set(JSON.parse(localStorage.getItem('pinnedFunds') || '[]'));

function savePinned() {
  localStorage.setItem('pinnedFunds', JSON.stringify([...pinnedSet]));
}
function toggleSort() {
  sortMode = sortMode === 'default' ? 'desc' : sortMode === 'desc' ? 'asc' : 'default';
  rerender();
}
function togglePin(idx, evt) {
  evt.stopPropagation();
  if (pinnedSet.has(idx)) pinnedSet.delete(idx);
  else pinnedSet.add(idx);
  savePinned();
  rerender();
}
function sortedFundIndices(map, fxChg, opts) {
  const items = FUNDS.map((fund, i) => ({ idx: i, chg: calcFund(fund, map, fxChg, opts) }));
  const pinned = items.filter(x => pinnedSet.has(x.idx));
  const rest = items.filter(x => !pinnedSet.has(x.idx));
  const sorter = sortMode === 'desc' ? (a, b) => (b.chg ?? -999) - (a.chg ?? -999)
               : sortMode === 'asc'  ? (a, b) => (a.chg ?? -999) - (b.chg ?? -999)
               : null;
  if (sorter) { pinned.sort(sorter); rest.sort(sorter); }
  return [...pinned, ...rest];
}

// ═══════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════
function allSymbols() {
  // Always include index/forex refs and proxy ETFs for uncovered fund weight.
  const set = new Set(['IXIC', 'QQQ', 'SPY', 'VIXY', 'USDCNY=X']);
  FUNDS.forEach(f => (f.holdings || []).forEach(h => {
    if (isUSHolding(h)) set.add(h.s);
  }));
  return [...set];
}

// mode: 'default' (homepage) — REGULAR shows realtime, all other states show last reg+post
//       '24h' — 实时价格 vs 前收盘：盘中用regular涨跌，盘后/隔夜用 reg+post 累计
function effectiveChange(q, opts = {}) {
  if (!q) return null;
  const mode = opts.mode || 'default';
  const s = q.marketState;

  if (mode === '24h') {
    // 24h模式：实时显示当前时段数据
    // 盘中：直接用盘中实时涨跌
    if (s === 'REGULAR') return q.regularMarketChangePercent ?? 0;
    // 盘前：显示盘后涨跌（afterHoursPrice vs 收盘价）
    if (s === 'PRE' || s === 'PREPRE') {
      const closePrice = q.closePrice || q.regularMarketPrice;
      if (q.afterHoursPrice && closePrice) {
        return ((q.afterHoursPrice - closePrice) / closePrice) * 100;
      }
      return q.postMarketChangePercent ?? 0;
    }
    // 盘后/已收盘：用盘外最新价 vs 收盘价，显示盘外涨跌
    const closePrice = q.closePrice || q.regularMarketPrice;
    if (q.afterHoursPrice && closePrice) {
      return ((q.afterHoursPrice - closePrice) / closePrice) * 100;
    }
    // 无盘外价 fallback
    return q.postMarketChangePercent ?? 0;
  }

  if (s === 'REGULAR') return q.regularMarketChangePercent ?? null;

  // POST / PRE-in-default / CLOSED: yesterday's regular + after-hours
  const reg = q.regularMarketChangePercent ?? 0;
  const post = q.postMarketChangePercent ?? 0;
  return reg + post * (1 + reg / 100);
}

function calcFund(fund, qmap, forexChg, opts = {}) {
  // Per-holding, currency-aware contribution:
  //   USD / HKD (HKD≈USD-pegged): apply USDCNY forex
  //   CNY (A-share):              direct, no forex
  // Uncovered fund weight uses a broad index proxy instead of extrapolating holdings.
  const fx = forexChg ?? 0;
  let sumW = 0, sumContrib = 0;
  for (const h of (fund.holdings || [])) {
    if (!isCovered(h)) continue;
    const q = qmap[h.s];
    if (!q) continue;
    const chg = effectiveChange(q, opts);
    if (chg === null) continue;

    const stockReturn = isCnyHolding(h)
      ? chg                                                    // 已是 CNY
      : ((1 + chg / 100) * (1 + fx / 100) - 1) * 100;         // USD/HKD × 汇率
    sumContrib += h.w * stockReturn;
    sumW       += h.w;
  }

  const coverageWeight = Math.min(1, Math.max(0, Number(fund.coverageWeight) || sumW));
  const uncoveredWeight = Math.max(0, 1 - coverageWeight);
  const proxyReturn = fundProxyReturn(fund, qmap, fx, opts);
  if (sumW === 0 && proxyReturn === null) return null;
  return sumContrib + uncoveredWeight * (proxyReturn ?? 0);
}

function fundProxyReturn(fund, qmap, forexChg, opts = {}) {
  const name = `${fund.name || ''} ${fund.code || ''}`;
  let weights;
  if (/新能源|电动|汽车|车/.test(name)) {
    weights = { QQQ: 0.65, SPY: 0.35 };
  } else if (/标普|S&P|信息科技|纳斯达克|科技|智能|互联|数字/.test(name)) {
    weights = { QQQ: 0.85, SPY: 0.15 };
  } else {
    weights = { QQQ: 0.60, SPY: 0.40 };
  }

  let total = 0, ret = 0;
  for (const [sym, w] of Object.entries(weights)) {
    const chg = effectiveChange(qmap[sym], opts);
    if (chg === null) continue;
    const cnyReturn = ((1 + chg / 100) * (1 + forexChg / 100) - 1) * 100;
    ret += w * cnyReturn;
    total += w;
  }
  return total > 0 ? ret / total : null;
}

// Mirror server ET calc (server.js getUSMarketState) for client-side labels
function usETNow() {
  const now = new Date();
  const month = now.getUTCMonth();
  const isDST = month > 2 && month < 10;        // rough US DST (Apr–Oct)
  const etOffsetMin = isDST ? -240 : -300;
  const et = new Date(now.getTime() + etOffsetMin * 60000);
  return { day: et.getUTCDay(), min: et.getUTCHours() * 60 + et.getUTCMinutes() };
}

// 24h-view session label (美东时间)
function us24hSession() {
  const { day, min } = usETNow();
  const weekday = day >= 1 && day <= 5;
  if (weekday) {
    if (min >= 240 && min < 570) return '盘前';   // 04:00–09:30
    if (min >= 570 && min < 960) return '盘中';   // 09:30–16:00
    if (min >= 960 && min < 1200) return '盘后';  // 16:00–20:00
    if (min >= 1200) return '夜盘';               // 20:00–24:00
  }
  // 00:00–04:00 工作日 or 周末
  if (weekday && min < 240) return '亚盘';
  return '亚盘';   // 周末
}

// 首页：工作日北京时间16:00之后显示24h视图，工作日5:00-16:00显示首页(基金列表)
function usMarketTrading() {
  const now = new Date();
  const utc = now.getTime() + now.getTimezoneOffset() * 60000;
  const bjTime = new Date(utc + 8 * 3600000);
  const day = bjTime.getDay();
  const min = bjTime.getHours() * 60 + bjTime.getMinutes();
  const weekday = day >= 1 && day <= 5;
  if (!weekday) return true; // 周末显示24h视图
  // 工作日：16:00之后显示24h，5:00-16:00显示首页
  if (min >= 960) return true;   // 16:00+ → 24h
  if (min >= 300) return false;  // 5:00-16:00 → 首页
  return true; // 0:00-5:00 → 24h（前一天盘后延续）
}

function marketLabel(qmap, opts = {}) {
  const mode = opts.mode || 'default';
  if (mode === '24h') return us24hSession();    // 含 夜盘/亚盘 的全时段标签
  const q = qmap['QQQ']; if (!q) return '盘中';
  const s = q.marketState;
  if (s === 'REGULAR') return '盘中';
  if (s === 'POST' || s === 'POSTPOST') return '盘后';
  if (s === 'PRE' || s === 'PREPRE') return '盘后';
  return '已收盘';
}

function effectivePrice(q) {
  if (!q) return null;
  // 优先盘后价格，盘后没数据再用盘前/盘中价
  if (q.afterHoursPrice) return q.afterHoursPrice;
  return q.preMarketPrice ?? q.regularMarketPrice ?? null;
}

function fmtPrice(v) {
  if (v === null || v === undefined || isNaN(v)) return '--';
  return v.toFixed(2);
}

function fmtPct(v) {
  if (v === null || v === undefined || isNaN(v)) return '--';
  const sign = v >= 0 ? '+' : '';
  return sign + v.toFixed(2) + '%';
}

function cls(v) {
  if (v === null || v === undefined || isNaN(v)) return 'flat';
  if (v > 0.005) return 'up';
  if (v < -0.005) return 'down';
  return 'flat';
}

function nowStr() {
  return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}

function holdingDisplayName(h) {
  return h.name_cn || CN_NAME[h.s] || h.s;
}

// ═══════════════════════════════════════════════════
//  DATA FETCH
// ═══════════════════════════════════════════════════
async function fetchFunds() {
  const r = await fetch('/api/funds');
  if (!r.ok) throw new Error(`/api/funds HTTP ${r.status}`);
  const json = await r.json();
  if (!json.success) throw new Error(json.error || 'funds load failed');
  return json.funds || [];
}

async function fetchQuotes() {
  const syms = allSymbols();
  const url = `/api/quotes?symbols=${encodeURIComponent(syms.join(','))}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const json = await r.json();
  if (!json.success) throw new Error(json.error || 'Unknown error');
  const map = {};
  (json.data || []).forEach(q => { map[q.symbol] = q; });
  return { map, stale: !!json.stale };
}

// A股指数MA20数据（上证+创业板）
let ASHARE_MA = null;
async function fetchAshareMa() {
  try {
    const r = await fetch('/api/ashare-ma');
    if (!r.ok) return;
    const json = await r.json();
    if (json.success) ASHARE_MA = { sh: json.sh, cy: json.cy };
  } catch (e) { console.error('[ashare-ma]', e); }
}

// 四大指数均线预警数据
let INDEX_MA = null;
async function fetchIndexMa() {
  try {
    const r = await fetch('/api/index-ma');
    if (!r.ok) return;
    const json = await r.json();
    if (json.success) {
      INDEX_MA = { sh: json.sh, cy: json.cy, ndx: json.ndx, kospi: json.kospi };
    }
  } catch (e) { console.error('[index-ma]', e); }
}


// ═══════════════════════════════════════════════════
//  ROUTING
// ═══════════════════════════════════════════════════
function currentRoute() {
  const hash = location.hash || '';
  if (hash === '#/history') return { view: 'history' };
  if (hash === '#/24h') return { view: '24h' };
  const m24h = hash.match(/^#\/24h\/fund\/(\d+)/);
  if (m24h) {
    const idx = parseInt(m24h[1], 10);
    if (idx >= 0 && idx < FUNDS.length) return { view: 'detail', idx, mode: '24h' };
  }
  const m = hash.match(/^#\/fund\/(\d+)/);
  if (m) {
    const idx = parseInt(m[1], 10);
    if (idx >= 0 && idx < FUNDS.length) return { view: 'detail', idx };
  }
  // 首页：美股交易时段(盘前/盘中/盘后)显示24h实时估值；休市(隔夜/周末)显示季报列表
  return usMarketTrading() ? { view: '24h' } : { view: 'list' };
}

window.addEventListener('hashchange', () => {
  expanded = false;
  rerender();
});

function go(hash) { location.hash = hash; }
function goBack() { if (history.length > 1) history.back(); else go('#/'); }
function expandAll() { expanded = true; rerender(); }

// ═══════════════════════════════════════════════════
//  RENDER — list view (with Futu-style change-flash)
// ═══════════════════════════════════════════════════

// Diff-vs-previous-tick → flash class for an element
const prevFundPct = new Map();          // fund index → previous pct value
const prevHeaderVal = { IXIC: null, QQQ: null, SPY: null, VIXY: null, FX: null };
const FLASH_EPS = 0.005;                // ignore noise below ~0.005%

function flashClass(prev, cur) {
  if (prev === undefined || prev === null || cur === null || cur === undefined || isNaN(cur)) return '';
  const d = cur - prev;
  if (d >  FLASH_EPS) return 'flash-up';
  if (d < -FLASH_EPS) return 'flash-down';
  return '';
}

function vixyBarHtml(vixyPrice, vixyChg, vixySignal, qqqChg, fxChg, opts = {}) {
  const showChgLink = !opts.hideChgLink;
  const chgCls = cls(vixyChg);
  const priceTxt = fmtPrice(vixyPrice);
  const chgTxt = fmtPct(vixyChg);

  // 均线预警表格：三级风险
  const MA_RULES = [
    { key: 'ma21',  lv: 'lv1', badge: '一级预警', condition: 'MA5下穿MA21',  advice: '减仓一半'        },
    { key: 'ma60',  lv: 'lv2', badge: '二级预警', condition: 'MA5下穿MA60',  advice: '清仓离场'        },
    { key: 'ma120', lv: 'lv3', badge: '三级预警', condition: 'MA5下穿MA120', advice: '空仓，切勿抄底'  },
    { key: 'ma250', lv: 'lv4', badge: '四级预警', condition: 'MA5下穿MA250', advice: '熊市空仓'  },
  ];
  function maTableBody() {
    if (!INDEX_MA) return `<tr><td colspan="4"><span class="ma-loading">均线数据加载中…</span></td></tr>`;
    const indices = [INDEX_MA.sh, INDEX_MA.cy, INDEX_MA.ndx, INDEX_MA.kospi];
    const rows = [];
    for (const { key, lv, badge, condition, advice } of MA_RULES) {
      const hits = indices.filter(d => d && d.crossBelow && d.crossBelow[key]).map(d => d.name);
      if (!hits.length) continue;
      const idxTags = hits.map(n => `<span class="ma-idx ${lv}">${n}</span>`).join('');
      rows.push(`
        <tr class="${lv}">
          <td class="ma-td-badge"><span class="ma-badge ${lv}">${badge}</span></td>
          <td class="ma-td-cond"><span>${condition}</span></td>
          <td class="ma-td-indices"><div class="ma-indices-wrap">${idxTags}</div></td>
          <td class="ma-td-advice"><span class="${lv}">${advice}</span></td>
        </tr>`);
    }
    if (!rows.length) return `<tr><td colspan="4"><span class="ma-none">各指数均线正常，持仓安全</span></td></tr>`;
    return rows.join('');
  }
  const maAlertHtml = `
    <div class="ma-alert-section">
      <table class="ma-table">
        <thead class="ma-table-head">
          <tr>
            <th>等级</th><th>触发条件</th><th>涉及指数</th><th>操作建议</th>
          </tr>
        </thead>
        <tbody>${maTableBody()}</tbody>
      </table>
    </div>`;

  // VIXY < 25: 正常状态，仅显示价格信息
  if (!vixyPrice || vixyPrice < 25) return `
    <div class="vixy-bar">
      <div class="vixy-row">
        <span class="vixy-label">VIXY 恐慌指数</span>
        <span class="vixy-price ${chgCls}">${priceTxt}</span>
        <span class="vixy-chg ${chgCls}">${chgTxt}</span>
        <span class="vixy-signal ${vixySignal.cls}">${vixySignal.text}</span>
        ${showChgLink ? `<span class="vixy-chg-link" onclick="go('#/history')">涨跌幅统计</span>` : ''}
      </div>
      ${maAlertHtml}
    </div>`;

  // VIXY >= 25: 带加仓建议的合并横幅
  let alertCls, amount, tip;
  if (vixyPrice >= 50) {
    alertCls = 'alert-full'; amount = '¥20,000'; tip = 'VIXY ≥ 50，历史级恐慌，满仓买入';
  } else if (vixyPrice >= 40) {
    alertCls = 'alert-full'; amount = '¥10,000'; tip = 'VIXY ≥ 40，历史大底区域，重仓抄底';
  } else if (vixyPrice >= 35) {
    alertCls = 'alert-add'; amount = '¥5,000'; tip = 'VIXY ≥ 35，恐慌升级，加大仓位逢低买入';
  } else if (vixyPrice >= 30) {
    alertCls = 'alert-buy'; amount = '¥2,000'; tip = 'VIXY ≥ 30，市场恐慌，分批建仓';
  } else {
    alertCls = 'alert-watch'; amount = '¥1,000'; tip = 'VIXY ≥ 25，波动加大，试探性建仓';
  }

  return `
    <div class="vixy-bar ${alertCls}">
      <div class="vixy-row">
        <span class="vixy-label">VIXY 恐慌指数</span>
        <span class="vixy-price">${priceTxt}</span>
        <span class="vixy-chg ${chgCls}">${chgTxt}</span>
        <span class="vixy-signal ${vixySignal.cls}">${vixySignal.text}</span>
        ${showChgLink ? `<span class="vixy-chg-link" onclick="go('#/history')">涨跌幅统计</span>` : ''}
      </div>
      <div class="vixy-action">
        <span class="alert-amount">建议加仓 QQQ：${amount}</span>
        <span class="alert-tip">${tip}</span>
      </div>
      ${maAlertHtml}
    </div>`;
}

function renderList() {
  const map = LAST_MAP;
  const mktLabel = marketLabel(map);
  const ixicChg = effectiveChange(map['IXIC']);
  const qqqChg  = effectiveChange(map['QQQ']);
  const spyChg  = effectiveChange(map['SPY']);
  const fxChg   = map['USDCNY=X']?.regularMarketChangePercent ?? 0;
  const vixyChg   = effectiveChange(map['VIXY']);
  const vixyPrice = effectivePrice(map['VIXY']);

  // Header tile flash classes (compare vs last tick)
  const fIxic = flashClass(prevHeaderVal.IXIC, ixicChg);
  const fQqq  = flashClass(prevHeaderVal.QQQ,  qqqChg);
  const fSpy  = flashClass(prevHeaderVal.SPY,  spyChg);
  const fFx   = flashClass(prevHeaderVal.FX,   fxChg);

  // Fund rows with per-row flash
  let rows = '';
  const sorted = sortedFundIndices(map, fxChg, {});
  const lastPinnedIdx = [...sorted].reverse().findIndex(x => pinnedSet.has(x.idx));
  const lastPinnedPos = lastPinnedIdx >= 0 ? sorted.length - 1 - lastPinnedIdx : -1;
  sorted.forEach((item, pos) => {
    const { idx, chg } = item;
    const fund = FUNDS[idx];
    const flash = flashClass(prevFundPct.get(idx), chg);
    const isPinned = pinnedSet.has(idx);
    const pinCls = isPinned ? 'pin-icon pinned' : 'pin-icon';
    rows += `
      <div class="fund-item ${flash}${isPinned ? ' pinned-item' : ''}" onclick="go('#/fund/${idx}')">
        <span class="${pinCls}" onclick="togglePin(${idx}, event)"><svg viewBox="0 0 24 24"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5v6h2v-6h5v-2z"/></svg></span>

          <span class="fund-name">${fund.name}</span>

        </div>
        <span class="fund-pct ${cls(chg)}">${fmtPct(chg)}</span>
        <span class="chevron">›</span>
      </div>`;
    if (pos === lastPinnedPos && lastPinnedPos < sorted.length - 1) rows += '<div class="pin-divider"></div>';
    prevFundPct.set(idx, chg);
  });

  // Commit header prev-values after computing flash
  prevHeaderVal.IXIC = ixicChg;
  prevHeaderVal.QQQ  = qqqChg;
  prevHeaderVal.SPY  = spyChg;
  prevHeaderVal.VIXY = vixyChg;
  prevHeaderVal.FX   = fxChg;

  const dotClass = LAST_STALE ? 'dot' : 'dot live';
  // 美股盘中(REGULAR)隐藏入口；盘前/盘后/已收盘时显示
  const isRegular = map['QQQ']?.marketState === 'REGULAR';
  const entryHtml = isRegular ? '' : `
    <div class="entry-row" onclick="go('#/24h')">
      <div class="entry-main">
        <span class="entry-label">美股24小时</span>

      </div>
      <span class="chevron">›</span>
    </div>`;

  const vixySignal = vixyPrice >= 40 ? { text: '重仓买入', cls: 'signal-heavy' }
                   : vixyPrice >= 35 ? { text: '加大仓位', cls: 'signal-heavy' }
                   : vixyPrice >= 30 ? { text: '逐步买入', cls: 'signal-buy' }
                   : vixyPrice >= 25 ? { text: '关注机会', cls: 'signal-watch' }
                   : vixyChg >= 10   ? { text: '恐慌提升', cls: 'signal-panic' }
                   : { text: '正常', cls: 'signal-normal' };

  document.getElementById('app').innerHTML = `
    <div class="header">
      <div class="h-item ${fIxic}">
        <div class="h-label">纳斯达克</div>
        <div class="h-val ${cls(ixicChg)}">${fmtPct(ixicChg)}</div>
      </div>
      <div class="h-item ${fQqq}">
        <div class="h-label">纳指100(QQQ)</div>
        <div class="h-val ${cls(qqqChg)}">${fmtPct(qqqChg)}</div>
      </div>
      <div class="h-item ${fSpy}">
        <div class="h-label">标普500(SPY)</div>
        <div class="h-val ${cls(spyChg)}">${fmtPct(spyChg)}</div>
      </div>
      <div class="h-item ${fFx}">
        <div class="h-label">汇率</div>
        <div class="h-val ${cls(fxChg)}">${fmtPct(fxChg)}</div>
      </div>
    </div>
    ${vixyBarHtml(vixyPrice, vixyChg, vixySignal, effectiveChange(map['QQQ'], { mode: '24h' }), fxChg)}
    <div class="status-bar">基于季报真实持仓计算&ensp;更新于 ${nowStr()}(<span class="mkt">${mktLabel}</span>), 仅供参考<span class="${dotClass}"></span>
    </div>
    <div class="list-toolbar">
      <span class="sort-header ${sortMode !== 'default' ? 'active' : ''}" onclick="toggleSort()">涨跌幅<span class="sort-arrows"><span class="arr ${sortMode === 'asc' ? 'on' : ''}">▲</span><span class="arr ${sortMode === 'desc' ? 'on' : ''}">▼</span></span></span>
    </div>
    <div class="fund-list">${rows}</div>

  `;
}

// ═══════════════════════════════════════════════════
//  RENDER — 24h all-session view (includes pre-market during PRE)
// ═══════════════════════════════════════════════════
const prevFundPct24h = new Map();
const prevHeaderVal24h = { IXIC: null, QQQ: null, SPY: null, VIXY: null, FX: null };

function render24h() {
  const map = LAST_MAP;
  const opts = { mode: '24h' };
  const mktLabel = marketLabel(map, opts);
  const qqqChg    = effectiveChange(map['QQQ'],  opts);
  const spyChg    = effectiveChange(map['SPY'],  opts);
  const vixyChg   = effectiveChange(map['VIXY'], opts);
  const vixyPrice = effectivePrice(map['VIXY']);
  const qqqPrice  = effectivePrice(map['QQQ']);
  const spyPrice  = effectivePrice(map['SPY']);
  const fxChg     = map['USDCNY=X']?.regularMarketChangePercent ?? 0;
  // IXIC 指数无盘后数据，用 QQQ 作为代理
  const ixicRaw   = effectiveChange(map['IXIC'], opts);
  const ixicChg   = (ixicRaw === 0 && qqqChg !== 0) ? qqqChg : ixicRaw;

  const fIxic = flashClass(prevHeaderVal24h.IXIC, ixicChg);
  const fQqq  = flashClass(prevHeaderVal24h.QQQ,  qqqChg);
  const fSpy  = flashClass(prevHeaderVal24h.SPY,  spyChg);
  const fFx   = flashClass(prevHeaderVal24h.FX,   fxChg);

  let rows = '';
  const sorted24 = sortedFundIndices(map, fxChg, opts);
  const lastPinIdx24 = [...sorted24].reverse().findIndex(x => pinnedSet.has(x.idx));
  const lastPinPos24 = lastPinIdx24 >= 0 ? sorted24.length - 1 - lastPinIdx24 : -1;
  sorted24.forEach((item, pos) => {

        <div class="fund-left">
          <span class="fund-name">${fund.name}</span>
          <span class="badge">${mktLabel}</span>
        </div>
        <span class="fund-pct ${cls(chg)}">${fmtPct(chg)}</span>
        <span class="chevron">›</span>
      </div>`;

    prevFundPct24h.set(idx, chg);
  });

  prevHeaderVal24h.IXIC = ixicChg;
  prevHeaderVal24h.QQQ  = qqqChg;
  prevHeaderVal24h.SPY  = spyChg;
  prevHeaderVal24h.VIXY = vixyChg;
  prevHeaderVal24h.FX   = fxChg;

  const dotClass = LAST_STALE ? 'dot' : 'dot live';

  const vixySignal24h = vixyPrice >= 40 ? { text: '重仓买入', cls: 'signal-heavy' }
                      : vixyPrice >= 35 ? { text: '加大仓位', cls: 'signal-heavy' }
                      : vixyPrice >= 30 ? { text: '逐步买入', cls: 'signal-buy' }
                      : vixyPrice >= 25 ? { text: '关注机会', cls: 'signal-watch' }
                      : vixyChg >= 10   ? { text: '恐慌提升', cls: 'signal-panic' }
                      : { text: '正常', cls: 'signal-normal' };

  const isHome = !location.hash || location.hash === '#' || location.hash === '#/';
  document.getElementById('app').innerHTML = `
    ${!isHome ? `<div class="h24-topbar"><button class="back-btn" onclick="goBack()">‹ 返回</button></div>` : ''}
    <div class="header">
      <div class="h-item ${fIxic}">
        <div class="h-label">纳斯达克</div>
        <div class="h-val ${cls(ixicChg)}">${fmtPct(ixicChg)}</div>
      </div>
      <div class="h-item ${fQqq}">
        <div class="h-label">纳指100(QQQ)</div>
        <div class="h-val ${cls(qqqChg)}">${fmtPct(qqqChg)}</div>
      </div>
      <div class="h-item ${fSpy}">
        <div class="h-label">标普500(SPY)</div>
        <div class="h-val ${cls(spyChg)}">${fmtPct(spyChg)}</div>
      </div>
      <div class="h-item ${fFx}">
        <div class="h-label">汇率</div>
        <div class="h-val ${cls(fxChg)}">${fmtPct(fxChg)}</div>
      </div>
    </div>
    ${vixyBarHtml(vixyPrice, vixyChg, vixySignal24h, qqqChg, fxChg)}
    <div class="status-bar">
      美股盘后/盘前实时估值&ensp;更新于 ${nowStr()}(<span class="mkt">${mktLabel}</span>)<span class="${dotClass}"></span>
    </div>
    <div class="list-toolbar">
      <span class="sort-header ${sortMode !== 'default' ? 'active' : ''}" onclick="toggleSort()">涨跌幅<span class="sort-arrows"><span class="arr ${sortMode === 'asc' ? 'on' : ''}">▲</span><span class="arr ${sortMode === 'desc' ? 'on' : ''}">▼</span></span></span>
    </div>

    <div class="footer">数据来源：天天基金（持仓）· 新浪财经（行情）<br>10秒自动刷新</div>
  `;
}

// ═══════════════════════════════════════════════════
//  RENDER — detail view
// ═══════════════════════════════════════════════════
function renderDetail(idx, mode) {
  const fund = FUNDS[idx];
  const map = LAST_MAP;
  const fxChg = map['USDCNY=X']?.regularMarketChangePercent ?? 0;
  const opts = mode === '24h' ? { mode: '24h' } : {};
  const est = calcFund(fund, map, fxChg, opts);

  const sorted = [...(fund.holdings || [])].sort((a, b) => b.w - a.w);
  const visible = expanded ? sorted : sorted.slice(0, 10);
  const hasMore = sorted.length > 10;

  const rowsHtml = visible.map(h => {
    const isUs = isUSHolding(h);
    const q = isUs ? map[h.s] : null;
    const chg = q ? effectiveChange(q, opts) : null;
    const tag = marketTag(h.market);
    return `
      <div class="holding-row">
        <span class="holding-name">${holdingDisplayName(h)}${tag ? `<span class="holding-mkt-tag">${tag}</span>` : ''}</span>
        <span class="holding-weight">${(h.w * 100).toFixed(2)}%</span>
        <span class="holding-chg ${cls(chg)}">${fmtPct(chg)}</span>
      </div>`;
  }).join('');

  const expandHtml = (hasMore && !expanded)
    ? `<button class="retry-btn" style="display:block;width:100%;margin:0;padding:16px;border-radius:0;border:none;border-bottom:1px solid var(--border);background:transparent;color:var(--text-name);font-size:14px" onclick="expandAll()">展开全部数据 (${sorted.length})</button>`
    : '';

  const qDate = fund.reportDate || '';
  const yDate = fund.annualDate || '';
  const coveragePct = ((Number(fund.coverageWeight) || sorted.reduce((s, h) => s + h.w, 0)) * 100).toFixed(1);
  let noteText;
  if (qDate && yDate && qDate !== yDate) {
    noteText = `基于 ${qDate} 最新报告结合 ${yDate} 中报/年报持仓计算, 披露覆盖 ${coveragePct}%, 剩余权重用指数代理, 共 ${sorted.length} 支`;
  } else if (qDate) {
    noteText = `基于 ${qDate} 最新报告持仓计算, 披露覆盖 ${coveragePct}%, 剩余权重用指数代理, 共 ${sorted.length} 支`;
  } else {
    noteText = `基于公开披露持仓计算, 披露覆盖 ${coveragePct}%, 剩余权重用指数代理, 共 ${sorted.length} 支`;
  }

  const mktLabel24h = mode === '24h' ? us24hSession() : '';

  document.getElementById('app').innerHTML = `
    <div class="detail-topbar">
      <button class="back-btn" onclick="goBack()">‹ 返回</button>
      <div class="detail-title">
        <div>${fund.name}</div>
        <div style="font-size:11px;color:var(--detail-code);font-weight:400;margin-top:2px;">${fund.code || ''}</div>
      </div>
      <div class="detail-est">
        <span class="est-label">${mode === '24h' ? mktLabel24h + ':' : '估值:'}</span><span class="${cls(est)}">${fmtPct(est)}</span>
      </div>
    </div>
    <div class="table-head">
      <span class="col-name">名称</span>
      <span class="col-pct">占比</span>
      <span class="col-chg">${mode === '24h' ? '盘后涨跌' : '涨跌幅'}</span>
    </div>
    ${rowsHtml}
    ${expandHtml}
    <div class="detail-footnote">${noteText}</div>
  `;
}

// ═══════════════════════════════════════════════════
//  RENDER dispatcher / errors
// ═══════════════════════════════════════════════════
function rerender() {
  const r = currentRoute();
  if (r.view === 'detail') renderDetail(r.idx, r.mode);
  else if (r.view === '24h') render24h();
  else if (r.view === 'history') renderHistory();
  else renderList();
}

// ═══════════════════════════════════════════════════
//  RENDER — history view (近15/30/60天涨跌幅)
// ═══════════════════════════════════════════════════
let historyData = null;       // 从 /api/fund-history 获取的数据
let historyPeriod = 15;       // 当前选中周期：15 | 30 | 60
let historySortMode = 'desc'; // 'desc' | 'asc' | 'default'

async function loadHistoryData() {
  if (historyData) return;
  try {
    const r = await fetch('/api/fund-history');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const json = await r.json();
    if (!json.success) throw new Error(json.error || 'fund-history failed');
    historyData = json.data || [];
    renderHistory();
  } catch (e) {
    document.getElementById('app').innerHTML = `
      <div style="padding:14px"><button class="back-btn" onclick="goBack()">‹ 返回</button></div>
      <div class="center-msg"><span style="color:var(--text-muted)">数据加载失败: ${e.message}</span>
      <button class="retry-btn" onclick="historyData=null;loadHistoryData()">重试</button></div>`;
  }
}

function toggleHistorySort() {
  historySortMode = historySortMode === 'default' ? 'desc'
                 : historySortMode === 'desc' ? 'asc' : 'default';
  renderHistory();
}

function setHistoryPeriod(p) {
  historyPeriod = p;
  historySortMode = 'desc'; // 切换周期时重置排序
  renderHistory();
}

function renderHistory() {
  const map = LAST_MAP;
  const mktLabel = marketLabel(map);

  // 如果数据还没加载，显示 loading
  if (!historyData) {
    document.getElementById('app').innerHTML = `
      <div style="padding:14px 14px 0"><button class="back-btn" onclick="goBack()">‹ 返回</button></div>
      <div class="header">
        <div class="h-item"><div class="h-label">纳斯达克</div><div class="h-val flat">--</div></div>
        <div class="h-item"><div class="h-label">纳指100(QQQ)</div><div class="h-val flat">--</div></div>
        <div class="h-item"><div class="h-label">标普500(SPY)</div><div class="h-val flat">--</div></div>
        <div class="h-item"><div class="h-label">汇率</div><div class="h-val flat">--</div></div>
      </div>
      <div class="history-loading"><div class="spinner"></div><span>加载净值历史…</span></div>`;
    loadHistoryData();
    return;
  }

  const ixicChg = effectiveChange(map['IXIC']);
  const qqqChg  = effectiveChange(map['QQQ']);
  const spyChg  = effectiveChange(map['SPY']);
  const fxChg   = map['USDCNY=X']?.regularMarketChangePercent ?? 0;

  // 根据当前周期取涨跌幅字段
  const periodKey = historyPeriod === 15 ? 'd15' : historyPeriod === 30 ? 'd30' : 'd60';

  // 日期区间：今天往前推 N 天
  function fmtDateCompact(d) {
    return d.getFullYear().toString()
      + String(d.getMonth() + 1).padStart(2, '0')
      + String(d.getDate()).padStart(2, '0');
  }
  const dateEnd   = new Date();
  const dateStart = new Date(dateEnd.getTime() - historyPeriod * 24 * 3600 * 1000);
  const dateRangeStr = `${fmtDateCompact(dateStart)} - ${fmtDateCompact(dateEnd)}`;

  // 排序
  let sortedData = [...historyData];
  if (historySortMode === 'desc') {
    sortedData.sort((a, b) => (b[periodKey] ?? -999) - (a[periodKey] ?? -999));
  } else if (historySortMode === 'asc') {
    sortedData.sort((a, b) => (a[periodKey] ?? -999) - (b[periodKey] ?? -999));
  }

  let rows = '';
  sortedData.forEach(item => {
    const chg = item[periodKey];
    rows += `
      <div class="fund-item">
        <div class="fund-left">
          <span class="fund-name">${item.name}</span>
          <span class="badge">${item.code}</span>
        </div>
        <span class="fund-pct ${cls(chg)}">${fmtPct(chg)}</span>
      </div>`;
  });

  const dotClass = LAST_STALE ? 'dot' : 'dot live';

  document.getElementById('app').innerHTML = `
    <div style="padding:10px 14px 0;background:var(--bg-header)"><button class="back-btn" onclick="goBack()">‹ 返回</button></div>
    <div class="header">
      <div class="h-item">
        <div class="h-label">纳斯达克</div>
        <div class="h-val ${cls(ixicChg)}">${fmtPct(ixicChg)}</div>
      </div>
      <div class="h-item">
        <div class="h-label">纳指100(QQQ)</div>
        <div class="h-val ${cls(qqqChg)}">${fmtPct(qqqChg)}</div>
      </div>
      <div class="h-item">
        <div class="h-label">标普500(SPY)</div>
        <div class="h-val ${cls(spyChg)}">${fmtPct(spyChg)}</div>
      </div>
      <div class="h-item">
        <div class="h-label">汇率</div>
        <div class="h-val ${cls(fxChg)}">${fmtPct(fxChg)}</div>
      </div>
    </div>
    <div class="status-bar">基于天天基金净值历史计算&ensp;更新于 ${nowStr()}(<span class="mkt">${mktLabel}</span>)<span class="${dotClass}"></span>
    </div>
    <div class="history-date-range">统计区间：${dateRangeStr}</div>
    <div class="history-toolbar">
      <span class="period-btn ${historyPeriod === 15 ? 'active' : ''}" onclick="setHistoryPeriod(15)">近15天</span>
      <span class="period-btn ${historyPeriod === 30 ? 'active' : ''}" onclick="setHistoryPeriod(30)">近30天</span>
      <span class="period-btn ${historyPeriod === 60 ? 'active' : ''}" onclick="setHistoryPeriod(60)">近60天</span>
      <span class="sort-header history-sort ${historySortMode !== 'default' ? 'active' : ''}" onclick="toggleHistorySort()">涨跌幅<span class="sort-arrows"><span class="arr ${historySortMode === 'asc' ? 'on' : ''}">▲</span><span class="arr ${historySortMode === 'desc' ? 'on' : ''}">▼</span></span></span>
    </div>
    <div class="fund-list">${rows}</div>
    <div class="footer">数据来源：天天基金（净值历史）<br>净值数据每日更新</div>
  `;
}

function renderError(msg) {
  document.getElementById('app').innerHTML = `
    <div class="center-msg">
      <span style="color:var(--text-muted)">数据加载失败</span>
      <span style="font-size:11px;color:var(--text-footer)">${msg}</span>
      <button class="retry-btn" onclick="bootstrap()">重试</button>
    </div>`;
}

// ═══════════════════════════════════════════════════
//  MAIN — bootstrap + polling loop
// ═══════════════════════════════════════════════════
async function pollLoop() {
  try {
    const { map, stale } = await fetchQuotes();
    LAST_MAP = map;
    LAST_STALE = stale;
    rerender();
  } catch (e) {
    console.error('quotes poll failed:', e);
  }
  clearTimeout(timer);
  timer = setTimeout(pollLoop, 10000);
}

async function bootstrap() {
  try {
    const funds = await fetchFunds();
    if (!funds.length) throw new Error('基金列表为空');
    FUNDS = funds.filter(f => f && (f.name || f.code));
    if (!FUNDS.length) throw new Error('未获取到任何持仓数据');
    fetchAshareMa();  // 非阻塞加载A股MA数据
    fetchIndexMa();   // 非阻塞加载四大指数均线预警
    await pollLoop();
  } catch (e) {
    renderError(e.message);
  }
}

// expose globals for inline onclick
window.go = go;
window.goBack = goBack;
window.expandAll = expandAll;
window.bootstrap = bootstrap;
window.toggleSort = toggleSort;
window.togglePin = togglePin;
window.setHistoryPeriod = setHistoryPeriod;
window.toggleHistorySort = toggleHistorySort;

bootstrap();
</script>
