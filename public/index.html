<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>美股基金估值</title>
  <style>
    /* ── Theme variables ── */
    :root {
      --bg: #111;
      --bg-secondary: #1a1e2c;
      --bg-card: transparent;
      --bg-active: #181818;
      --bg-badge: #202020;
      --bg-entry: linear-gradient(180deg, #181c28 0%, #14172a 100%);
      --bg-header: radial-gradient(ellipse at 50% 0%, rgba(56, 76, 120, 0.35) 0%, transparent 70%), linear-gradient(180deg, #1a1e2c 0%, #14172040 60%, #11111100 100%);
      --bg-vixy: linear-gradient(180deg, #1a1e2c 0%, #141720 100%);
      --text-primary: #e8e8e8;
      --text-name: #d8d8d8;
      --text-holding: #e0e0e0;
      --text-weight: #d0d0d0;
      --text-secondary: #8088a0;
      --text-muted: #555;
      --text-footer: #333;
      --text-status: #505050;
      --text-status-mkt: #686868;
      --border: #181818;
      --border-header: #232838;
      --border-detail: #1e1e1e;
      --border-badge: #2a2a2a;
      --border-entry: #262c40;
      --shadow-header: 0 1px 0 rgba(255,255,255,0.04) inset, 0 2px 6px rgba(0,0,0,0.4);
      --header-line: linear-gradient(90deg, transparent 0%, #2a3045 50%, transparent 100%);
      --spinner-border: #2a2a2a;
      --spinner-top: #555;
      --btn-bg: #1e1e1e;
      --btn-border: #333;
      --btn-color: #888;
      --btn-active: #2a2a2a;
      --back-btn: #aaa;
      --back-btn-active: #fff;
      --detail-title: #f0f0f0;
      --detail-code: #666;
      --est-label: #888;
      --table-head: #7a7a7a;
      --chevron: #444;
      --dot-bg: #444;
      --entry-label: #e8e8e8;
      --entry-sub: #6a7080;
      --flash-up-start: rgba(240, 82, 42, 0.32);
      --flash-up-mid: rgba(240, 82, 42, 0.22);
      --flash-down-start: rgba(26, 173, 79, 0.30);
      --flash-down-mid: rgba(26, 173, 79, 0.20);
      --up: #e84c3d;
      --down: #2ebd85;
      --flat: #666;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f6f8;
        --bg-secondary: #ffffff;
        --bg-card: #ffffff;
        --bg-active: #f0f1f3;
        --bg-badge: #f0f1f4;
        --bg-entry: linear-gradient(180deg, #ffffff 0%, #f8f9fc 100%);
        --bg-header: linear-gradient(180deg, #ffffff 0%, #f5f7fa 100%);
        --bg-vixy: linear-gradient(180deg, #ffffff 0%, #f8f9fc 100%);
        --text-primary: #1a1a1a;
        --text-name: #222222;
        --text-holding: #1a1a1a;
        --text-weight: #444444;
        --text-secondary: #6b7280;
        --text-muted: #9ca3af;
        --text-footer: #9ca3af;
        --text-status: #9ca3af;
        --text-status-mkt: #6b7280;
        --border: #eef0f3;
        --border-header: #e5e7eb;
        --border-detail: #eef0f3;
        --border-badge: #e5e7eb;
        --border-entry: #e5e7eb;
        --shadow-header: 0 1px 3px rgba(0,0,0,0.06);
        --header-line: linear-gradient(90deg, transparent 0%, #e5e7eb 50%, transparent 100%);
        --spinner-border: #e5e7eb;
        --spinner-top: #9ca3af;
        --btn-bg: #ffffff;
        --btn-border: #e5e7eb;
        --btn-color: #6b7280;
        --btn-active: #f0f1f3;
        --back-btn: #6b7280;
        --back-btn-active: #1a1a1a;
        --detail-title: #1a1a1a;
        --detail-code: #9ca3af;
        --est-label: #9ca3af;
        --table-head: #9ca3af;
        --chevron: #d1d5db;
        --dot-bg: #d1d5db;
        --entry-label: #1a1a1a;
        --entry-sub: #6b7280;
        --flash-up-start: rgba(240, 82, 42, 0.15);
        --flash-up-mid: rgba(240, 82, 42, 0.08);
        --flash-down-start: rgba(26, 173, 79, 0.15);
        --flash-down-mid: rgba(26, 173, 79, 0.08);
        --up: #e84c3d;
        --down: #2ebd85;
        --flat: #9ca3af;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* ── Header (list view) ── */
    .header {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      padding: 12px 6px 10px;
      gap: 2px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-header);
      box-shadow: var(--shadow-header);
      position: relative;
    }
    .header::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: -1px;
      height: 1px;
      background: var(--header-line);
    }
    .h-item {
      text-align: center;
      min-width: 0;
      padding: 4px 2px;
      border-radius: 6px;
      transition: background 0.4s ease-out;
    }
    .h-item.flash-up   { background: rgba(204, 41, 41, 0.25); }
    .h-item.flash-down { background: rgba(13, 140, 66, 0.25); }
    .h-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .h-val   { font-size: 18px; font-weight: 700; letter-spacing: -0.4px; font-variant-numeric: tabular-nums; }

    /* ── VIXY 恐慌指标栏 ── */
    .vixy-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--bg-vixy);
      border-bottom: 1px solid var(--border-header);
    }
    .vixy-bar .vixy-price {
      font-size: 19px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .vixy-bar .vixy-label {
      font-size: 12px;
      color: var(--text-secondary);
    }
    .vixy-bar .vixy-chg {
      font-size: 13px;
      font-weight: 600;
    }
    .vixy-bar .vixy-signal {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .vixy-signal.signal-normal {
      color: var(--text-secondary);
      background: rgba(128,136,160,0.12);
    }
    .vixy-signal.signal-watch {
      color: #5ba8d6;
      background: rgba(91,168,214,0.15);
    }
    .vixy-signal.signal-panic {
      color: #e6a700;
      background: rgba(230,167,0,0.15);
    }
    .vixy-signal.signal-buy {
      color: #f0522a;
      background: rgba(240,82,42,0.18);
    }
    .vixy-signal.signal-heavy {
      color: #ff2d2d;
      background: rgba(255,45,45,0.22);
      animation: pulse-signal 1.2s ease-in-out infinite;
    }
    @keyframes pulse-signal {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* ── VIXY 加仓提醒横幅 ── */
    .vixy-alert {
      margin: 0;
      padding: 10px 14px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-header);
      animation: alert-glow 2s ease-in-out infinite;
    }
    .vixy-alert .alert-price {
      font-size: 17px;
      font-weight: 700;
      margin: 0 5px;
      font-variant-numeric: tabular-nums;
    }
    .vixy-alert .alert-tip {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      font-weight: 400;
      opacity: 0.8;
    }
    .vixy-alert.alert-buy {
      color: #ff6b35;
      background: linear-gradient(180deg, rgba(240,82,42,0.22) 0%, rgba(240,82,42,0.08) 100%);
      border-top: 2px solid rgba(240,82,42,0.6);
    }
    .vixy-alert.alert-add {
      color: #ff4040;
      background: linear-gradient(180deg, rgba(255,45,45,0.25) 0%, rgba(255,45,45,0.10) 100%);
      border-top: 2px solid rgba(255,45,45,0.7);
    }
    .vixy-alert.alert-full {
      color: #ff2020;
      background: linear-gradient(180deg, rgba(255,30,30,0.30) 0%, rgba(255,30,30,0.12) 100%);
      border-top: 3px solid rgba(255,30,30,0.9);
      animation: alert-glow 1.2s ease-in-out infinite;
    }
    @keyframes alert-glow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }

    .status-bar {
      text-align: center;
      padding: 6px 12px;
      font-size: 13px;
      color: var(--text-status);
      border-bottom: 1px solid var(--border);
      line-height: 1.6;
    }
    .status-bar .mkt { color: var(--text-status-mkt); }

    /* ── Fund list ── */
    .fund-item {
      display: flex;
      align-items: center;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      background-color: var(--bg-card);
      cursor: pointer;
      position: relative;
      transition: background-color 0.18s ease-out;
    }
    .fund-item:active { background-color: var(--bg-active); }

    /* Futu-style price-change flash */
    @keyframes fund-flash-up {
      0%   { background-color: rgba(232, 76, 61, 0.18); }
      100% { background-color: var(--bg-card); }
    }
    @keyframes fund-flash-down {
      0%   { background-color: rgba(46, 189, 133, 0.18); }
      100% { background-color: var(--bg-card); }
    }
    .fund-item.flash-up   { animation: fund-flash-up 1s ease-out; }
    .fund-item.flash-down { animation: fund-flash-down 1s ease-out; }

    .fund-left { flex: 1; display: flex; align-items: center; gap: 7px; min-width: 0; }
    .fund-name { font-size: 14px; color: var(--text-name); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fund-code { font-size: 13px; color: var(--text-muted); font-variant-numeric: tabular-nums; letter-spacing: 0.4px; flex-shrink: 0; }
    .badge {
      flex-shrink: 0;
      font-size: 11px;
      padding: 1px 4px;
      border-radius: 3px;
      background: var(--bg-badge);
      color: var(--text-muted);
      border: 1px solid var(--border-badge);
    }
    .fund-pct {
      font-size: 13px;
      font-weight: 400;
      min-width: 72px;
      text-align: center;
      letter-spacing: -0.2px;
      font-variant-numeric: tabular-nums;
      padding: 4px 8px;
      border-radius: 3px;
      color: #fff;
    }
    .fund-pct.up   { background: #f23a2f; color: #fff; }
    .fund-pct.down { background: #33c85a; color: #fff; }
    .fund-pct.flat { background: var(--bg-active); color: var(--flat); }
    .chevron { color: var(--chevron); font-size: 16px; margin-left: 6px; }

    /* Chinese convention: red = up, green = down */
    .up   { color: var(--up); }
    .down { color: var(--down); }
    .flat { color: var(--flat); }

    /* ── Detail view ── */
    .detail-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 14px 10px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-detail);
    }
    .back-btn {
      background: transparent; border: none; color: var(--back-btn);
      font-size: 17px; cursor: pointer; padding: 4px 8px 4px 0;
      display: flex; align-items: center; gap: 4px;
    }
    .back-btn:active { color: var(--back-btn-active); }
    .h24-topbar { padding: 10px 14px 0; background: var(--bg-header); }
    .detail-title { font-size: 16px; font-weight: 600; color: var(--detail-title); flex: 1; text-align: center; margin: 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.3; }
    .detail-est { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 100px; text-align: right; }
    .detail-est .est-label { color: var(--est-label); font-weight: 400; font-size: 12px; margin-right: 4px; }

    .table-head {
      display: grid;
      grid-template-columns: 1fr 80px 90px;
      padding: 9px 12px 7px;
      font-size: 12px;
      color: var(--table-head);
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
    }
    .table-head .col-pct { text-align: right; padding-right: 12px; }
    .table-head .col-chg { text-align: right; }

    .holding-row {
      display: grid;
      grid-template-columns: 1fr 80px 90px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
      align-items: center;
    }
    .holding-name { font-size: 14px; color: var(--text-holding); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .holding-mkt-tag { font-size: 11px; color: var(--text-muted); margin-left: 4px; padding: 1px 3px; border: 1px solid var(--border-badge); border-radius: 2px; }
    .holding-weight { text-align: right; padding-right: 10px; font-size: 14px; color: var(--text-weight); font-variant-numeric: tabular-nums; }
    .holding-chg { text-align: right; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }

    .detail-footnote {
      text-align: center;
      padding: 18px 14px 30px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
    }

    /* ── Loading / Error ── */
    .center-msg {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 200px; color: var(--text-muted); font-size: 15px; gap: 12px;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--spinner-border); border-top-color: var(--spinner-top); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .retry-btn {
      padding: 7px 18px; background: var(--btn-bg); border: 1px solid var(--btn-border);
      color: var(--btn-color); border-radius: 5px; cursor: pointer; font-size: 14px;
    }
    .retry-btn:active { background: var(--btn-active); }

    .footer {
      text-align: center; padding: 20px 16px 30px; font-size: 13px; color: var(--text-footer);
    }

    /* ── 24h entry card ── */
    .entry-row {
      display: flex;
      align-items: center;
      margin: 18px 14px 6px;
      padding: 14px 16px;
      background: var(--bg-entry);
      border: 1px solid var(--border-entry);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.18s ease-out, border-color 0.18s ease-out;
    }
    .entry-row:active { border-color: var(--text-secondary); }
    .entry-main { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .entry-label { font-size: 16px; color: var(--entry-label); font-weight: 600; letter-spacing: 0.3px; }
    .entry-sub { font-size: 13px; color: var(--entry-sub); }
    .entry-row .chevron { color: var(--entry-sub); font-size: 18px; margin-left: 8px; }

    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--dot-bg); margin-left: 4px; vertical-align: middle; }
    .dot.live { background: #27ae60; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* ── Sort & Pin ── */
    .list-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 7px 30px 7px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
    }
    .sort-header {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .sort-header:active { opacity: 0.6; }
    .sort-header.active { color: var(--text-name); }
    .sort-arrows {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      line-height: 0.72;
      font-size: 9px;
    }
    .sort-arrows .arr { color: var(--flat); }
    .sort-arrows .arr.on { color: var(--up); }
    .pin-icon {
      margin-right: 4px;
      cursor: pointer;
      flex-shrink: 0;
      padding: 2px;
      opacity: 0.35;
      transition: opacity 0.15s;
      display: inline-flex;
      align-items: center;
    }
    .pin-icon svg { width: 14px; height: 14px; fill: var(--text-muted); }
    .pin-icon.pinned { opacity: 1; }
    .pin-icon.pinned svg { fill: var(--up); }
    .fund-item.pinned-item { border-bottom-color: var(--border-header); }
    .pin-divider {
      height: 1px;
      background: var(--border-header);
      margin: 0;
    }
  </style>
</head>
<body>
<div id="app"><div class="center-msg"><div class="spinner"></div><span>加载持仓数据…</span></div></div>

<script>
// Fallback Chinese names (used when eastmoney didn't provide one)
const CN_NAME = {
  AAPL: '苹果', MSFT: '微软', NVDA: '英伟达', AMZN: '亚马逊',
  META: 'Meta', GOOGL: '谷歌-A', GOOG: '谷歌-C',
  TSLA: '特斯拉', AVGO: '博通', COST: '好市多', NFLX: '奈飞',
  AMD: 'AMD', INTC: '英特尔', CRM: 'Salesforce', ORCL: '甲骨文',
  AMAT: '应用材料', QCOM: '高通', LRCX: '泛林集团', KLAC: '科磊',
  TXN: '德州仪器', ADI: '亚德诺', ADBE: '奥多比',
  TSM: '台积电', NIO: '蔚来', LI: '理想汽车', XPEV: '小鹏汽车',
  RIVN: 'Rivian', F: '福特', GM: '通用汽车', ON: '安森美',
  SNAP: 'Snap', UBER: '优步', PINS: 'Pinterest',
  MRVL: '迈威尔科技', 'USDCNY=X': 'USD/CNY',
};

// Eastmoney market id → label / Sina prefix
//   105 NASDAQ   106 NYSE   107 NYSE-Arca/AMEX   116 HK
//   0 SZ A-share   1 SH A-share
//   KR (synthetic)  Korean KRX, fetched via Naver Finance
const COVERED_MARKETS = new Set(['105', '106', '107', '116', '0', '1', 'KR']);
const CNY_MARKETS     = new Set(['0', '1']);  // A-shares are already in CNY
function isCovered(h) { return COVERED_MARKETS.has(String(h.market)); }
function isCnyHolding(h) { return CNY_MARKETS.has(String(h.market)); }
// Backward alias so other code still reads cleanly
function isUSHolding(h) { return isCovered(h); }
function marketTag(m) {
  m = String(m);
  if (m === '116') return '港股';
  if (m === '0') return 'A股·深';
  if (m === '1') return 'A股·沪';
  if (m === 'KR') return '韩股';
  return '';
}

// Globals populated from /api/funds
let FUNDS = [];          // [{ name, code, reportDate, totalCount, holdings:[{s,w,name_cn,market}], usCoveredWeight }]
let LAST_MAP = {};       // symbol → quote
let LAST_STALE = false;
let timer = null;
let expanded = false;

// Sort & Pin state
let sortMode = 'default';  // 'default' | 'desc' | 'asc'
const pinnedSet = new Set(JSON.parse(localStorage.getItem('pinnedFunds') || '[]'));

function savePinned() {
  localStorage.setItem('pinnedFunds', JSON.stringify([...pinnedSet]));
}
function toggleSort() {
  sortMode = sortMode === 'default' ? 'desc' : sortMode === 'desc' ? 'asc' : 'default';
  rerender();
}
function togglePin(idx, evt) {
  evt.stopPropagation();
  if (pinnedSet.has(idx)) pinnedSet.delete(idx);
  else pinnedSet.add(idx);
  savePinned();
  rerender();
}
function sortedFundIndices(map, fxChg, opts) {
  const items = FUNDS.map((fund, i) => ({ idx: i, chg: calcFund(fund, map, fxChg, opts) }));
  const pinned = items.filter(x => pinnedSet.has(x.idx));
  const rest = items.filter(x => !pinnedSet.has(x.idx));
  const sorter = sortMode === 'desc' ? (a, b) => (b.chg ?? -999) - (a.chg ?? -999)
               : sortMode === 'asc'  ? (a, b) => (a.chg ?? -999) - (b.chg ?? -999)
               : null;
  if (sorter) { pinned.sort(sorter); rest.sort(sorter); }
  return [...pinned, ...rest];
}

// ═══════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════
function allSymbols() {
  // Always include index/forex refs; quote API only handles US tickers right now
  const set = new Set(['IXIC', 'QQQ', 'SPY', 'VIXY', 'USDCNY=X']);
  FUNDS.forEach(f => f.holdings.forEach(h => {
    if (isUSHolding(h)) set.add(h.s);
  }));
  return [...set];
}

// mode: 'default' (homepage) — REGULAR shows realtime, all other states show last reg+post
//       '24h' — 全时段实时估值：盘中用regular涨跌，盘前/盘后/收盘用累计(regular+post)
function effectiveChange(q, opts = {}) {
  if (!q) return null;
  const mode = opts.mode || 'default';
  const s = q.marketState;

  if (mode === '24h') {
    // 24h模式：显示收盘后/收盘前的实时变动
    // 参考点 = 最近一次正式收盘价，目标 = 当前盘后/盘前价格
    // postMarketChangePercent = (盘后或盘前价 - 收盘价) / 收盘价
    // 这就是基金下一次净值会反映的"隔夜变动"
    const post = q.postMarketChangePercent ?? 0;
    if (s === 'REGULAR') return q.regularMarketChangePercent ?? 0;
    return post;
  }

  if (s === 'REGULAR') return q.regularMarketChangePercent ?? null;

  // POST / PRE-in-default / CLOSED: yesterday's regular + after-hours
  const reg = q.regularMarketChangePercent ?? 0;
  const post = q.postMarketChangePercent ?? 0;
  return reg + post * (1 + reg / 100);
}

function calcFund(fund, qmap, forexChg, opts = {}) {
  // Per-holding, currency-aware contribution:
  //   USD / HKD (HKD≈USD-pegged): apply USDCNY forex
  //   CNY (A-share):              direct, no forex
  // Then normalize by covered weight (extrapolate to full fund).
  const fx = forexChg ?? 0;
  let sumW = 0, sumContrib = 0;
  for (const h of fund.holdings) {
    if (!isCovered(h)) continue;
    const q = qmap[h.s];
    if (!q) continue;
    const chg = effectiveChange(q, opts);
    if (chg === null) continue;

    const stockReturn = isCnyHolding(h)
      ? chg                                                    // 已是 CNY
      : ((1 + chg / 100) * (1 + fx / 100) - 1) * 100;         // USD/HKD × 汇率
    sumContrib += h.w * stockReturn;
    sumW       += h.w;
  }
  if (sumW === 0) return null;
  return sumContrib / sumW;
}

// Mirror server ET calc (server.js getUSMarketState) for client-side labels
function usETNow() {
  const now = new Date();
  const month = now.getUTCMonth();
  const isDST = month > 2 && month < 10;        // rough US DST (Apr–Oct)
  const etOffsetMin = isDST ? -240 : -300;
  const et = new Date(now.getTime() + etOffsetMin * 60000);
  return { day: et.getUTCDay(), min: et.getUTCHours() * 60 + et.getUTCMinutes() };
}

// 24h-view session label — 只显示 盘前/盘中/盘后 (美东时间)
//   数据源参考 bowtie《美股交易时间》:
//   盘前 04:00–09:30 · 盘中 09:30–16:00 · 盘后 16:00–20:00 (ET)
//   收盘后(夜盘/隔夜)及周末统一归为「盘后」, 不显示「已收盘」
function us24hSession() {
  const { day, min } = usETNow();
  const weekday = day >= 1 && day <= 5;
  if (weekday) {
    if (min >= 240 && min < 570) return '盘前';   // 04:00–09:30
    if (min >= 570 && min < 960) return '盘中';   // 09:30–16:00
  }
  return '盘后';   // 16:00–次日04:00、夜盘、隔夜及周末统一显示盘后
}

// 美股是否处于交易时段(盘前/盘中/盘后)：周末休市、隔夜(20:00–次日04:00 ET)休市
//   交易时段 = 工作日美东 04:00–20:00 (盘前 04:00–09:30 · 盘中 09:30–16:00 · 盘后 16:00–20:00)
function usMarketTrading() {
  const { day, min } = usETNow();
  if (day === 0 || day === 6) return false;   // 周六/周日 休市
  return min >= 240 && min < 1200;            // 04:00–20:00 ET
}

function marketLabel(qmap, opts = {}) {
  const mode = opts.mode || 'default';
  if (mode === '24h') return us24hSession();    // 含 夜盘/亚盘 的全时段标签
  const q = qmap['QQQ']; if (!q) return '盘中';
  const s = q.marketState;
  if (s === 'REGULAR') return '盘中';
  if (s === 'POST' || s === 'POSTPOST') return '盘后';
  if (s === 'PRE' || s === 'PREPRE') return '盘后';
  return '已收盘';
}

function effectivePrice(q) {
  if (!q) return null;
  const s = q.marketState;
  if (s === 'PRE' || s === 'PREPRE') return q.preMarketPrice ?? q.regularMarketPrice ?? null;
  if (s === 'POST' || s === 'POSTPOST') return q.postMarketPrice ?? q.regularMarketPrice ?? null;
  return q.regularMarketPrice ?? null;
}

function fmtPrice(v) {
  if (v === null || v === undefined || isNaN(v)) return '--';
  return v.toFixed(2);
}

function fmtPct(v) {
  if (v === null || v === undefined || isNaN(v)) return '--';
  const sign = v >= 0 ? '+' : '';
  return sign + v.toFixed(2) + '%';
}

function cls(v) {
  if (v === null || v === undefined || isNaN(v)) return 'flat';
  if (v > 0.005) return 'up';
  if (v < -0.005) return 'down';
  return 'flat';
}

function nowStr() {
  return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}

function holdingDisplayName(h) {
  return h.name_cn || CN_NAME[h.s] || h.s;
}

async function fetchFunds() {
  const r = await fetch('/api/funds');
  if (!r.ok) throw new Error(`/api/funds HTTP ${r.status}`);
  const json = await r.json();
  if (!json.success) throw new Error(json.error || 'funds load failed');
  return json.funds || [];
}

async function fetchQuotes() {
  const syms = allSymbols();
  const url = `/api/quotes?symbols=${encodeURIComponent(syms.join(','))}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const json = await r.json();
  if (!json.success) throw new Error(json.error || 'Unknown error');
  const map = {};
  (json.data || []).forEach(q => { map[q.symbol] = q; });
  return { map, stale: !!json.stale };
}

function currentRoute() {
  const hash = location.hash || '';
  if (hash === '#/24h') return { view: '24h' };
  const m24h = hash.match(/^#\/24h\/fund\/(\d+)/);
  if (m24h) {
    const idx = parseInt(m24h[1], 10);
    if (idx >= 0 && idx < FUNDS.length) return { view: 'detail', idx, mode: '24h' };
  }
  const m = hash.match(/^#\/fund\/(\d+)/);
  if (m) {
    const idx = parseInt(m[1], 10);
    if (idx >= 0 && idx < FUNDS.length) return { view: 'detail', idx };
  }
  // 首页：美股交易时段(盘前/盘中/盘后)显示24h实时估值；休市(隔夜/周末)显示季报列表
  return usMarketTrading() ? { view: '24h' } : { view: 'list' };
}

function flashClass(prev, cur) {
  if (prev === undefined || prev === null || cur === null || cur === undefined || isNaN(cur)) return '';

  if (d >  FLASH_EPS) return 'flash-up';
  if (d < -FLASH_EPS) return 'flash-down';
  return '';
}

      </div>
      <div class="detail-est">
        <span class="est-label">${mode === '24h' ? mktLabel24h + ':' : '估值:'}</span><span class="${cls(est)}">${fmtPct(est)}</span>
      </div>
    </div>
    <div class="table-head">
      <span class="col-name">名称</span>
      <span class="col-pct">占比</span>
      <span class="col-chg">${mode === '24h' ? '盘后涨跌' : '涨跌幅'}</span>
    </div>
    ${rowsHtml}
    ${expandHtml}
    <div class="detail-footnote">${noteText}</div>
  `;
}

// ═══════════════════════════════════════════════════
//  RENDER dispatcher / errors
// ═══════════════════════════════════════════════════
function rerender() {
  const r = currentRoute();
  if (r.view === 'detail') renderDetail(r.idx, r.mode);
  else if (r.view === '24h') render24h();
  else renderList();
}

function renderError(msg) {
  document.getElementById('app').innerHTML = `
    <div class="center-msg">
      <span style="color:var(--text-muted)">数据加载失败</span>
      <span style="font-size:11px;color:var(--text-footer)">${msg}</span>
      <button class="retry-btn" onclick="bootstrap()">重试</button>
    </div>`;
}

// ═══════════════════════════════════════════════════
//  MAIN — bootstrap + polling loop
// ═══════════════════════════════════════════════════
async function pollLoop() {
  try {
    const { map, stale } = await fetchQuotes();
    LAST_MAP = map;
    LAST_STALE = stale;
    rerender();
  } catch (e) {
    console.error('quotes poll failed:', e);
  }
  clearTimeout(timer);
  timer = setTimeout(pollLoop, 5000);
}

async function bootstrap() {
  try {
    const funds = await fetchFunds();
    if (!funds.length) throw new Error('基金列表为空');
    FUNDS = funds.filter(f => f.holdings && f.holdings.length > 0);
    if (!FUNDS.length) throw new Error('未获取到任何持仓数据');
    await pollLoop();
  } catch (e) {
    renderError(e.message);
  }
}

// expose globals for inline onclick
window.go = go;
window.goBack = goBack;
window.expandAll = expandAll;
window.bootstrap = bootstrap;

bootstrap();
</script>
</body>
</html>
