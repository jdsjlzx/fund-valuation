//  RENDER — 纳指科技ETF 专用视图
//   · 实时跟踪：现价 / 溢价率 / 均线 / MACD
//   · 每日操作建议：溢价率（一级风控）× 技术面 × 持仓
//   · 分时图 + 盘中提示（新提示以浮层弹出 + 可选桌面通知）
//   · 买卖信号清单：哪天该买、哪天该卖，附信号后表现
//   · 我的持仓：移动加权成本记账（localStorage）
// ═══════════════════════════════════════════════════
const ETF_TRADES_KEY = 'etf-159509-trades';
let ETF_TRACK = null;
let ETF_LOAD_ERR = null;
let ETF_LOADING = false;
let ETF_SHOW_ALL_SIGNALS = false;
let ETF_NOTIFY = localStorage.getItem('etf-notify') === '1';
let ETF_SOUND = localStorage.getItem('etf-sound') !== '0';   // 提示音（默认开）
let ETF_ALERT_SEEN = null;      // null = 尚未首次加载（首次只弹「重要」项，避免开场刷屏）
let ETF_ALERT_LOG = [];         // 本次会话触发的提示（倒序）
let ETF_ALERT_EXPAND = false;   // 盘中提示：是否展开全部（默认只列 Top3）
let ETF_ALERT_LOG_OPEN = false; // 「本次会话已触发」是否展开
let ETF_RENDERED_DATE = null;   // 已整页渲染对应的交易日（跨日时整页重绘）
let etfLastLoadTs = 0;
let ETF_PREMIUM_RANGE = (localStorage.getItem('etf-premium-range') === 'all') ? 'all' : 'recent';   // 溢价率走势：recent=近120日 / all=全历史
let ETF_TRADES = (() => {
  try {
    const v = JSON.parse(localStorage.getItem(ETF_TRADES_KEY) || '[]');
    return Array.isArray(v) ? v : [];
  } catch { return []; }
})();

function etfSaveTrades() {
  try { localStorage.setItem(ETF_TRADES_KEY, JSON.stringify(ETF_TRADES)); } catch { /* 忽略 */ }
}

function todayLocalStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// 带符号的百分比（原 fmtPct 不带 + 号）
function etfPct(v) {
  if (v === null || v === undefined || isNaN(v)) return '--';
  return `${v > 0 ? '+' : ''}${v.toFixed(2)}%`;
}

// 图表宽度：按容器实际宽度出图，避免固定 viewBox 被横向拉伸导致文字变形
// （body 有 max-width 560px，左右各 12px padding；extra 为容器额外内缩，如盘面面板卡片的边框+内边距）
function etfChartWidth(extra = 0) {
  const vw = (typeof window !== 'undefined' && window.innerWidth) ? window.innerWidth : 400;
  return Math.max(280, Math.min(vw, 560) - 24 - extra);
}

// 移动加权平均成本（AVCO）：买入累加成本，卖出按当时均价结转已实现盈亏
function etfPosition() {
  const list = [...ETF_TRADES].sort((a, b) => (String(a.date) + String(a.id)).localeCompare(String(b.date) + String(b.id)));
  let shares = 0, cost = 0, realized = 0;
  for (const t of list) {
    const q = Number(t.shares) || 0;
    const p = Number(t.price) || 0;
    if (q <= 0 || p <= 0) continue;
    if (t.side === 'buy') {
      cost += p * q;
      shares += q;
    } else {
      const avg = shares > 0 ? cost / shares : 0;
      const qty = Math.min(q, shares);
      realized += (p - avg) * qty;
      cost -= avg * qty;
      shares -= qty;
    }
  }
  return { shares, cost, avgCost: shares > 0 ? cost / shares : 0, realized };
}

async function loadEtfTrack() {
  if (ETF_LOADING) return;
  ETF_LOADING = true;
  try {
    const pos = etfPosition();
    const qs = pos.shares > 0 ? `?cost=${pos.avgCost.toFixed(4)}&shares=${pos.shares}` : '';
    const r = await fetch('/api/etf-track' + qs);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const json = await r.json();
    if (!json.success) throw new Error(json.error || 'etf-track failed');
    ETF_TRACK = json;
    ETF_LOAD_ERR = null;
    processEtfAlerts(json.alerts || []);
  } catch (e) {
    ETF_LOAD_ERR = e.message;
  } finally {
    ETF_LOADING = false;
  }
}

// 「该出手了」类提示：首次打开页面也要弹（否则开盘时条件已满足就静默错过）
const ETF_ALERT_URGENT = /^(buy_opportunity|buy_probe|premium_cross_dn|macd_flip_pos|macd_flip_neg|break_ma21)/;

// 新提示 → 浮层 + 提示音 +（可选）桌面通知
// 首次加载只登记；但「买入机会 / 减仓信号 / 穿越买入线」这类会照常弹出
function processEtfAlerts(alerts) {
  const first = ETF_ALERT_SEEN === null;
  if (first) ETF_ALERT_SEEN = new Set();
  for (const a of alerts) {
    if (!a || !a.key || ETF_ALERT_SEEN.has(a.key)) continue;
    ETF_ALERT_SEEN.add(a.key);
    const urgent = ETF_ALERT_URGENT.test(a.key);
    if (first && !urgent) continue;
    const time = nowStr();
    ETF_ALERT_LOG.unshift({ ...a, time, first });
    if (ETF_ALERT_LOG.length > 40) ETF_ALERT_LOG.length = 40;
    etfToast({ ...a, time }, urgent);
  }
  // 条件解除后允许再次提示
  const keys = new Set(alerts.map(a => a && a.key).filter(Boolean));
  for (const k of [...ETF_ALERT_SEEN]) if (!keys.has(k)) ETF_ALERT_SEEN.delete(k);
}

// 短促提示音（WebAudio 合成，无需音频文件；未交互过的页面会被浏览器拦截，静默跳过）
function etfBeep(urgent) {
  if (!ETF_SOUND) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = (etfBeep.ctx && etfBeep.ctx.state !== 'closed') ? etfBeep.ctx : (etfBeep.ctx = new Ctx());
    if (ctx.state === 'suspended') ctx.resume();
    const beep = (freq, at, dur) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + at);
      g.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + at + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + at); o.stop(ctx.currentTime + at + dur + 0.02);
    };
    if (urgent) { beep(880, 0, 0.14); beep(1320, 0.18, 0.18); }
    else beep(660, 0, 0.12);
  } catch { /* 忽略 */ }
}

function etfToast(a, urgent) {
  let box = document.getElementById('toast-box');
  if (!box) {
    box = document.createElement('div');
    box.id = 'toast-box';
    box.className = 'toast-box';
    document.body.appendChild(box);
  }
  const el = document.createElement('div');
  el.className = `toast ${a.level || 'info'}${urgent ? ' urgent' : ''}`;
  el.innerHTML = `<div class="toast-title">${a.title || '提示'}</div><div class="toast-text">${a.text || ''}</div><div class="toast-time">${a.time || nowStr()}</div>`;
  el.onclick = () => el.remove();
  box.appendChild(el);
  setTimeout(() => el && el.remove(), urgent ? 60000 : 25000);
  etfBeep(urgent);
  // 页面在后台时闪一下标签页标题，切回来能看到
  if (urgent && typeof document !== 'undefined' && document.hidden) {
    if (!etfToast._title) etfToast._title = document.title;
    document.title = `🔔 ${a.title || '提示'} · 159509`;
    if (!etfToast._onVis) {
      etfToast._onVis = true;
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && etfToast._title) { document.title = etfToast._title; etfToast._title = null; }
      });
    }
  }
  if (ETF_NOTIFY && 'Notification' in window && Notification.permission === 'granted') {
    try {
      const n = new Notification(`159509 · ${a.title || '提示'}`, { body: a.text || '', tag: a.key || undefined });
      n.onclick = () => { try { window.focus(); n.close(); } catch { /* 忽略 */ } };
    } catch { /* 忽略 */ }
  }
}

// 提示音开关（首次点击即解锁 WebAudio）
function etfToggleSound() {
  ETF_SOUND = !ETF_SOUND;
  localStorage.setItem('etf-sound', ETF_SOUND ? '1' : '0');
  if (ETF_SOUND) { etfBeep(false); etfToast({ level: 'info', title: '提示音已开启', text: '出现买入机会 / 减仓信号时会响两声' }); }
  renderEtfPosition();
}

function etfToggleNotify() {
  if (!('Notification' in window)) {
    etfToast({ level: 'warn', title: '当前浏览器不支持桌面通知', text: '仍会在页面内弹出提示浮层' });
    return;
  }
  if (ETF_NOTIFY) {
    ETF_NOTIFY = false;
    localStorage.setItem('etf-notify', '0');
    renderEtfPosition();
    return;
  }
  Notification.requestPermission().then(p => {
    ETF_NOTIFY = (p === 'granted');
    localStorage.setItem('etf-notify', ETF_NOTIFY ? '1' : '0');
    if (!ETF_NOTIFY) etfToast({ level: 'warn', title: '通知权限被拒绝', text: '仍会在页面内弹出提示浮层' });
    renderEtfPosition();
  });
}

function etfQuoteInlineHtml() {
  const t = ETF_TRACK;

// ── 今日操作建议 ──
// ── 买点确认：溢价达标 + 「不追高」过滤器（威廉%R / MA21 / 布林中轨）──
// 依据 764 日回测：只按溢价买 → 年化 56.1%；再要求至少一项过滤器命中 → 57.6%；
// 而溢价达标但价格仍在冲高时买入，短期期望收益明显偏低。这些指标不用作卖出信号。
function etfConfirmHtml() {
  const t = ETF_TRACK;
  const c = t && t.advice && t.advice.confirm;
  if (!c) return '';
  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const buy = (t.premium && t.premium.rules) ? t.premium.rules.buy : 18;
  const prem = t.premium ? t.premium.current : null;
  const rows = [
    { label: `溢价 ≤ ${buy}%`, value: prem != null ? `${prem.toFixed(2)}%` : '—', ok: c.premiumOk },
    ...(c.filters || []).map(f => ({ label: f.label, value: f.value, ok: f.ok })),
  ];
  const items = rows.map(x => `
        <span class="etf-confirm-item ${x.ok ? 'ok' : 'no'}" title="${esc(x.ok ? '已满足' : '未满足')}">
          <span class="mk">${x.ok ? '✓' : '○'}</span>${esc(x.label)}<b>${esc(x.value)}</b>
        </span>`).join('');
  const nFilter = (c.filters || []).length;
  const badge = c.level === 'none' ? '溢价未达标'
    : c.level === 'good' ? `过滤命中 ${c.hitCount}/${nFilter}`
      : '溢价达标 · 未见回调';
  return `
      <div class="etf-confirm lv-${esc(c.level)}">
        <div class="etf-confirm-head">
          <span class="etf-confirm-title">买点确认</span>
          <span class="etf-confirm-badge">${esc(badge)}</span>
        </div>
        <div class="etf-confirm-items">${items}</div>
        <div class="etf-confirm-note">${esc(c.note)}</div>
      </div>`;
}

// ── 溢价档位条（策略阈值可视化：15% 加仓线 / 18% 买入线 / 22% 警戒线 / 27% 减仓线）──
function etfPremiumZonesHtml() {
  const t = ETF_TRACK;
  const p = t && t.premium;
  if (!p || !p.rules) return `<div class="etf-empty">溢价档位数据不可用</div>`;
  const R = p.rules;
  const cur = p.current;
  const pr = p.prices || {};
  const MAXV = 35;                       // 展示刻度上限（历史最高约 32.3%）
  const segs = [
    { key: 'add',   lo: 0,        hi: R.add,    label: '加仓区', cls: 'cheap',   tip: '多买' },
    { key: 'buy',   lo: R.add,    hi: R.buy,    label: '买入区', cls: 'ok',      tip: '买入' },
    { key: 'watch', lo: R.buy,    hi: R.watch,  label: '观望',   cls: 'warn',    tip: '不加仓' },
    { key: 'avoid', lo: R.watch,  hi: R.danger, label: '高溢价', cls: 'high',    tip: '只减不加' },
    { key: 'exit',  lo: R.danger, hi: MAXV,     label: '极高',   cls: 'extreme', tip: '减仓' },
  ];
  const curZone = p.band ? p.band.key : null;
  const bar = segs.map(s => {
    const w = Math.max(1, ((s.hi - s.lo) / MAXV) * 100);
    return `<div class="etf-zone-seg ${s.cls}${s.key === curZone ? ' active' : ''}" style="width:${w.toFixed(2)}%" title="${s.label} ${s.lo}~${s.hi}%">${s.label}</div>`;
  }).join('');
  const markerPos = cur == null ? null : Math.min(Math.max(cur, 0), MAXV) / MAXV * 100;
  const marker = markerPos == null ? '' : `
    <div class="etf-zone-marker${markerPos > 84 ? ' edge-r' : markerPos < 16 ? ' edge-l' : ''}" style="left:${markerPos.toFixed(2)}%">
      <span>当前 ${cur.toFixed(2)}%</span><i></i>
    </div>`;

  const now = t.quote && t.quote.price != null ? t.quote.price : (t.ind ? t.ind.price : null);
  const dist = px => (now != null && px > 0) ? ((now / px - 1) * 100) : null;
  const rowOf = (cls, name, o, hint) => {
    if (!o) return '';
    const d = dist(o.price);
    return `<div class="etf-zone-price ${cls}">
      <span>${name}</span><b>${o.price.toFixed(3)}</b>
      <em>溢价 ${o.pct}%${d == null ? '' : d > 0 ? ` · 需跌 ${d.toFixed(2)}%` : ` · 已低于 ${Math.abs(d).toFixed(2)}%`}${hint ? ' · ' + hint : ''}</em>
    </div>`;
  };
  const d = p.dist;
  const distLine = d ? `<div class="etf-zone-scale" style="margin-top:7px">
      <span>历史 ${d.days} 个交易日中位数 ${d.median}%</span>
      <span>当前处于历史 ${d.pctRank}% 分位（越低越便宜）</span>
    </div>` : '';

  return `
    <div class="etf-zones">
      <div class="etf-zone-bar">${marker}${bar}</div>
      <div class="etf-zone-scale">
        <span>0%</span><span>${R.add}%</span><span>${R.buy}%</span><span>${R.watch}%</span><span>${R.danger}%</span><span>${MAXV}%+</span>
      </div>
      <div class="etf-zone-prices">
        ${rowOf('add', `加仓价`, pr.add, '可多买')}
        ${rowOf('buy', `买入价`, pr.buy, '可买入')}
        ${rowOf('watch', '警戒价', pr.watch, '只减不加')}
        ${rowOf('cut', '减仓价', pr.cut, '减仓避险')}
      </div>
      <div class="etf-legend" style="margin-top:8px">
        <span>策略：溢价 ≤${R.buy}% 可买入，＜${R.add}% 可多买；≥${R.watch}% 只减不加，≥${R.danger}% 减仓</span>
      </div>
      ${distLine}
    </div>`;
}

// ── 历史回溯与策略对比（全历史） ──
function etfReviewHtml() {
  const t = ETF_TRACK;
  const r = t && t.review;
  if (!r) return `<div class="etf-empty">回溯数据不可用</div>`;
  const f = (v, d = 2) => (v == null || !isFinite(v) ? '—' : Number(v).toFixed(d));
  const sg = v => (v == null || !isFinite(v) ? '—' : `<span class="${cls(v)}">${v >= 0 ? '+' : ''}${Number(v).toFixed(2)}%</span>`);
  const fmtD = d => { const s = String(d || ''); return s.length >= 10 ? `${s.slice(2, 4)}/${s.slice(5, 7)}/${s.slice(8, 10)}` : s; };
  const pd = r.premiumDist || {};

  const buyRows = (r.bestBuys || []).map((b, i) => `<tr>
      <td class="num">${fmtD(b.date)}</td>
      <td class="num">${f(b.close, 3)}</td>
      <td class="num">${b.premium == null ? '—' : f(b.premium, 1) + '%'}</td>
      <td class="num">${sg(b.r20)}</td>
      <td class="num">${sg(b.r60)}</td>
    </tr>`).join('');
  const sellRows = (r.bestSells || []).map(b => `<tr>
      <td class="num">${fmtD(b.date)}</td>
      <td class="num">${f(b.close, 3)}</td>
      <td class="num">${b.premium == null ? '—' : f(b.premium, 1) + '%'}</td>
      <td class="num"><span class="down">${f(b.low20)}%</span></td>
    </tr>`).join('');
  const sigRows = (r.signalBuys || []).map(b => `<tr>
      <td class="num">${fmtD(b.date)}</td>
      <td class="num">${f(b.close, 3)}</td>
      <td>${b.label}</td>
      <td class="num">${b.premium == null ? '—' : f(b.premium, 1) + '%'}</td>
      <td class="num">${sg(b.r20)}</td>
    </tr>`).join('');
  const btRows = (r.backtest || []).map(b => {
    const best = b.name === '买入持有（基准）';
    return `<tr class="${best ? 'hl' : ''}">
      <td>${b.name}<div class="etf-bt-sub">${b.trades} 次交易${b.winPct != null ? ` · 胜率 ${b.winPct}%` : ''} · 持仓时间 ${b.exposurePct}%</div></td>
      <td class="num ${b.totalPct >= 0 ? 'up' : 'down'}">${b.totalPct >= 0 ? '+' : ''}${f(b.totalPct, 1)}%</td>
      <td class="num ${b.annualPct >= 0 ? 'up' : 'down'}">${b.annualPct >= 0 ? '+' : ''}${f(b.annualPct, 1)}%</td>
      <td class="num down">${f(b.mddPct, 1)}%</td>
    </tr>`;
  }).join('');

  // 由数据自动生成的结论
  const hold = (r.backtest || []).find(b => b.name === '买入持有（基准）') || {};
  const macd = (r.backtest || []).find(b => /^MACD 信号/.test(b.name)) || {};
  const notes = [];
  if (pd.median != null) notes.push(`全历史溢价中位数 ${pd.median}%，≤${18}% 的交易日占 ${pd.belowBuy}%、＜15% 占 ${pd.belowAdd}%；≥22% 仅 ${pd.aboveWatchDays} 天（${pd.aboveWatch}%）、≥27% 仅 ${pd.aboveDangerDays} 天。`);
  if (macd.totalPct != null && hold.totalPct != null) notes.push(`MACD 信号择时累计 ${macd.totalPct}% vs 买入持有 ${hold.totalPct}%：这类长期上行标的择时反而拖累收益。`);
  if (hold.mddPct != null) notes.push(`区间最大回撤 ${hold.mddPct}%（${(r.bestSells || []).map(x => fmtD(x.date)).slice(0, 3).join(' / ')} 附近是几处典型顶部）。`);

  return `
    <div class="etf-review-top">
      <span>${fmtD(r.start)} ~ ${fmtD(r.end)}</span>
      <span>${r.days} 个交易日</span>
      <span>累计 ${r.buyHoldPct >= 0 ? '+' : ''}${f(r.buyHoldPct, 1)}%</span>
      <span>最低 ${f(r.rangeLow.close, 3)}（${fmtD(r.rangeLow.date)}）</span>
      <span>最高 ${f(r.rangeHigh.close, 3)}（${fmtD(r.rangeHigh.date)}）</span>
    </div>

    <div class="etf-sec-title" style="margin-top:12px"><span>事后最优买点</span><span class="sub">按买入后 20 日涨幅排序（同一波低点只留一天）</span></div>
    <table class="etf-signal-table">
      <thead><tr><th>日期</th><th>价格</th><th>溢价</th><th>后20日</th><th>后60日</th></tr></thead>
      <tbody>${buyRows || '<tr><td colspan="5">—</td></tr>'}</tbody>
    </table>

    <div class="etf-sec-title" style="margin-top:12px"><span>事后最优卖点</span><span class="sub">按卖出后 20 日内最深跌幅排序</span></div>
    <table class="etf-signal-table">
      <thead><tr><th>日期</th><th>价格</th><th>溢价</th><th>后20日最深</th></tr></thead>
      <tbody>${sellRows || '<tr><td colspan="4">—</td></tr>'}</tbody>
    </table>

    <div class="etf-sec-title" style="margin-top:12px"><span>策略真正会出手的买点</span><span class="sub">MACD 买入信号 ∩ 溢价 ≤${(t.premium && t.premium.rules ? t.premium.rules.buy : 18)}%</span></div>
    <table class="etf-signal-table">
      <thead><tr><th>日期</th><th>价格</th><th>信号</th><th>当时溢价</th><th>后20日</th></tr></thead>
      <tbody>${sigRows || '<tr><td colspan="5">—</td></tr>'}</tbody>
    </table>

    <div class="etf-sec-title" style="margin-top:12px"><span>策略对比（全历史回测）</span><span class="sub">收盘价成交，未计手续费</span></div>
    <table class="etf-signal-table etf-bt-table">
      <thead><tr><th>策略</th><th>总收益</th><th>年化</th><th>最大回撤</th></tr></thead>
      <tbody>${btRows}</tbody>
    </table>

    <div class="etf-review-notes">
      ${notes.map(n => `<div class="etf-review-note">· ${n}</div>`).join('')}
      <div class="etf-review-note">· 后视镜结论：好买点几乎都出现在溢价 ≤15% 且价格靠近 MA21 的位置；好卖点多出现在溢价 ≥19% 或指数冲高后放量滞涨时。历史统计不代表未来。</div>
    </div>`;
}

// ── 盘中提示（面板内紧凑展示，默认只列最重要的 3 条） ──
const ETF_ALERT_TOP = 3;
function etfAlertsHtml() {
  const t = ETF_TRACK || {};
  const list = t.alerts || [];
  const s = t.session || {};
  const shown = ETF_ALERT_EXPAND ? list : list.slice(0, ETF_ALERT_TOP);
  const live = shown.map(a => `
    <div class="etf-alert ${a.level}">
      <span class="etf-alert-title">${a.title}</span>
      <span class="etf-alert-text">${a.text}</span>
    </div>`).join('');
  const more = list.length > ETF_ALERT_TOP
    ? `<div class="etf-more" onclick="etfToggleAlerts()">${ETF_ALERT_EXPAND ? '收起' : `展开全部 ${list.length} 条提示 ▾`}</div>` : '';
  const logs = ETF_ALERT_LOG || [];
  const logBlock = logs.length ? `
    <div class="etf-more" onclick="etfToggleAlertLog()">本次会话已触发 ${logs.length} 条${ETF_ALERT_LOG_OPEN ? ' ▴' : ' ▾'}</div>
    ${ETF_ALERT_LOG_OPEN ? `<div class="etf-alert-log">${logs.slice(0, 10).map(e => `
      <div class="etf-alert-log-item"><span class="etf-alert-log-time">${e.time}</span><span>${e.title} · ${e.text}</span></div>`).join('')}</div>` : ''}` : '';
  const empty = (!live && !logs)
    ? `<div class="etf-empty" style="padding:3px 0">当前无提示${!s.trading ? '（A 股休市，开盘后生效）' : ''}</div>` : '';
  return `
    <div class="etf-board-head">
      <span class="${s.trading ? 'live' : ''}">盘中提示</span>
      <span class="sub">买入 / 减仓机会会弹窗${ETF_NOTIFY ? ' · 通知' : ''}${ETF_SOUND ? ' · 声音' : ''}</span>
    </div>
    ${empty}
    ${live ? `<div class="etf-alerts">${live}</div>` : ''}
    ${more}
    ${logBlock}`;
}

function etfToggleAlerts() {
  ETF_ALERT_EXPAND = !ETF_ALERT_EXPAND;

}
function etfToggleAlertLog() {
  ETF_ALERT_LOG_OPEN = !ETF_ALERT_LOG_OPEN;
  const el = document.getElementById('etf-alerts');
  if (el) el.innerHTML = etfAlertsHtml();
}

// ── 分时图 ──
function etfIntradayHtml() {
  const t = ETF_TRACK;
  const d = t && t.intraday;
  const q = (t && t.quote) || {};
  const s = (t && t.session) || {};
  const head = (sub) => `
    <div class="etf-board-head">
      <span class="${s.trading ? 'live' : ''}">分时走势</span>
      <span class="sub">${sub}</span>
    </div>`;
  if (!d || !d.points || d.points.length < 2) return head('—') + `<div class="etf-empty">分时数据不可用</div>` + etfQuoteInlineHtml();
  const pts = d.points;
  const prevClose = d.prevClose || q.prevClose || pts[0].price;
  const W = etfChartWidth(24), H = 124, PL = 36, PR = 10, PT = 9, PB = 18;   // 面板卡片：左右边框1+内边距11
  const vals = [];
  pts.forEach(p => { vals.push(p.price); if (p.avg != null) vals.push(p.avg); });
  vals.push(prevClose);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (!(hi > lo)) hi = lo + 0.01;
  const pad = (hi - lo) * 0.16;
  lo -= pad; hi += pad;
  const n = pts.length;
  const X = i => PL + (i / (n - 1)) * (W - PL - PR);
  const Y = v => PT + ((hi - v) / (hi - lo)) * (H - PT - PB);
  const pathOf = key => {
    let s = '', started = false;
    for (let i = 0; i < n; i++) {
      const v = pts[i][key];
      if (v == null || !isFinite(v)) continue;
      s += `${started ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)} `;
      started = true;
    }
    return s.trim();
  };
  const lastP = pts[n - 1].price;
  const main = lastP >= prevClose ? '#e84c3d' : '#2ebd85';

  let grid = '';
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * (k / 4);
    const y = Y(v);
    grid += `<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W - PR}" y2="${y.toFixed(1)}" stroke="var(--etf-grid)" stroke-width="1"/>`
          + `<text x="${PL - 5}" y="${(y + 3.2).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--text-muted)">${v.toFixed(3)}</text>`;
  }
  let tgrid = '';
  for (const tk of ['09:30', '10:30', '11:30', '14:00', '15:00']) {
    const i = pts.findIndex(p => p.t === tk);
    if (i < 0) continue;
    const x = X(i);
    tgrid += `<line x1="${x.toFixed(1)}" y1="${PT}" x2="${x.toFixed(1)}" y2="${H - PB}" stroke="var(--etf-grid)" stroke-width="1" stroke-dasharray="2 3"/>`
           + `<text x="${x.toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${tk}</text>`;
  }
  const yP = Y(prevClose);
  const prevLine = `<line x1="${PL}" y1="${yP.toFixed(1)}" x2="${W - PR}" y2="${yP.toFixed(1)}" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="4 3"/>`
    + `<text x="${W - PR - 1}" y="${(yP - 4).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--text-secondary)">昨收 ${prevClose.toFixed(3)}</text>`;

  let refLines = '';
  const refs = [];
  if (t.premium && t.premium.iopv) refs.push({ v: t.premium.iopv, c: '#e8a03d', label: 'IOPV' });
  if (t.ind && t.ind.ma21) refs.push({ v: t.ind.ma21, c: '#4a9fe0', label: 'MA21' });
  if (t.ind && t.ind.ma5) refs.push({ v: t.ind.ma5, c: '#8899aa', label: 'MA5' });
  for (const r of refs) {
    if (!isFinite(r.v) || r.v < lo || r.v > hi) continue;
    const y = Y(r.v);
    refLines += `<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W - PR}" y2="${y.toFixed(1)}" stroke="${r.c}" stroke-width="1" stroke-dasharray="1 3" opacity="0.6"/>`
      + `<text x="${PL + 3}" y="${(y - 3).toFixed(1)}" font-size="8.5" fill="${r.c}">${r.label} ${r.v.toFixed(3)}</text>`;
  }

  const pricePath = pathOf('price');
  const avgPath = pathOf('avg');
  const areaPath = pricePath ? `${pricePath} L${X(n - 1).toFixed(1)} ${(H - PB).toFixed(1)} L${X(0).toFixed(1)} ${(H - PB).toFixed(1)} Z` : '';
  const lastDot = `<circle cx="${X(n - 1).toFixed(1)}" cy="${Y(lastP).toFixed(1)}" r="2.6" fill="${main}"/>`;

  const chgFromPrev = ((lastP / prevClose - 1) * 100);
  const dataTime = (q.quoteTime || '').slice(11);
  return `
    ${head(`${d.date || '—'}${dataTime ? ` · 数据 ${dataTime}` : ''}`)}
    <div class="etf-chart-wrap">
      <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="height:124px">
        <defs>
          <linearGradient id="etf-ia" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${main}" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="${main}" stop-opacity="0"/>
          </linearGradient>
        </defs>
        ${grid}${tgrid}
        ${areaPath ? `<path d="${areaPath}" fill="url(#etf-ia)"/>` : ''}
        ${prevLine}${refLines}
        ${avgPath ? `<path d="${avgPath}" fill="none" stroke="#e8a03d" stroke-width="1.1" stroke-dasharray="3 2" opacity="0.9"/>` : ''}
        ${pricePath ? `<path d="${pricePath}" fill="none" stroke="${main}" stroke-width="1.5"/>` : ''}
        ${lastDot}
      </svg>
    </div>
    <div class="etf-legend">
      <span><i style="background:${main}"></i>价格 ${lastP.toFixed(3)}（${chgFromPrev >= 0 ? '+' : ''}${chgFromPrev.toFixed(2)}%）</span>
      <span><i style="background:#e8a03d"></i>均价</span>
      <span><i style="background:var(--text-muted)"></i>昨收</span>
    </div>
    ${etfQuoteInlineHtml()}`;
}

// ── 买卖信号清单 ──
function etfSignalsHtml() {
  const t = ETF_TRACK;
  if (!t || !t.signals || !t.signals.length) return `<div class="etf-empty">暂无信号</div>`;
  const all = [...t.signals].reverse();
  const show = ETF_SHOW_ALL_SIGNALS ? all : all.slice(0, 12);
  // 日期带年份（YYYY-MM-DD），并单独标出年份便于快速定位
  const fmtDate = d => {
    const s = String(d || '');
    if (s.length < 10) return s.replace(/\(至今\)/, '');
    return `${s.slice(0, 4)}-${s.slice(5, 7)}-${s.slice(8, 10)}`;
  };
  const rows = show.map(s => {
    let follow = '';
    if (s.side === 'buy') {
      const r = s.holdRetPct ?? 0;
      follow = `持有至 ${fmtDate(s.holdUntil)}<br><span class="${cls(r)}">${etfPct(r)}</span>`;
    } else {
      const r = s.avoidPct ?? 0;
      follow = `空仓至 ${fmtDate(s.holdUntil)}<br><span class="${cls(r)}">${etfPct(r)}</span>`;
    }
    return `<tr>
      <td class="num">${fmtDate(s.date)}</td>
      <td class="num">${s.close.toFixed(3)}</td>
      <td><span class="sig-badge ${s.side}">${s.label}</span></td>
      <td>${s.action}</td>
      <td class="num" style="font-size:9.5px">${follow}</td>
    </tr>`;
  }).join('');
  const more = all.length > 12
    ? `<div class="etf-signal-more" onclick="etfToggleSignals()">${ETF_SHOW_ALL_SIGNALS ? '收起' : `展开全部 ${all.length} 条`}</div>`
    : '';
  const st = t.stats || {};
  return `
    <table class="etf-signal-table">
      <thead><tr><th>日期</th><th>价格</th><th>信号</th><th>操作</th><th>后续表现</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${more}
    <div class="etf-legend" style="margin-top:6px">
      <span>共 ${st.sellCount != null ? st.sellCount + st.buyCount : all.length} 条（买入 ${st.buyCount ?? '—'} / 卖出 ${st.sellCount ?? '—'}），买入信号胜率 ${st.winRate != null ? st.winRate.toFixed(1) + '%' : '—'}</span>
    </div>
    <div class="etf-legend">
      <span>「后续表现」：买入信号=持有至下一次卖出信号；卖出信号=空仓期间标的涨跌（绿=躲过下跌）</span>
    </div>`;
}

function etfToggleSignals() {
  ETF_SHOW_ALL_SIGNALS = !ETF_SHOW_ALL_SIGNALS;
  const el = document.getElementById('etf-signals');
  if (el) el.innerHTML = etfSignalsSectionInner();
}

// ── 日K MACD 柱 ──
function etfMacdBarsHtml(bars) {
  if (!bars || !bars.length) return `<div class="etf-empty">数据不足</div>`;
  const maxAbs = Math.max(...bars.map(b => Math.abs(b.bar)), 0.0001);
  const MAX_HALF = 27;
  const fmtDate = d => {
    const s = String(d || '');
    return s.length >= 10 ? `${+s.slice(5, 7)}/${+s.slice(8, 10)}` : s.length === 8 ? `${+s.slice(4, 6)}/${+s.slice(6, 8)}` : s;
  };
  return bars.map((b, i) => {
    const isLatest = i === bars.length - 1;
    const h = Math.max(1, Math.round(Math.abs(b.bar) / maxAbs * MAX_HALF));
    const posCls = b.bar >= 0 ? 'pos' : 'neg';
    const intradayCls = b.intraday ? ' intraday' : '';
    const latestCls = (isLatest && !b.intraday) ? ' latest' : '';
    const pin = b.signal
      ? `<span class="macd-signal-pin ${b.signal}"><span class="macd-inline-signal ${b.signal}">${String(b.signal).startsWith('buy') ? 'B' : 'S'}</span><span class="macd-signal-date">${fmtDate(b.date)}</span></span>`
      : '';
    const bar = `<div class="macd-bar ${posCls}${latestCls}${intradayCls}" style="height:${h}px"></div>`;
    return b.bar >= 0
      ? `<div class="macd-bar-col">${pin}<div class="macd-bar-top">${bar}</div><div class="macd-bar-bot"></div></div>`
      : `<div class="macd-bar-col">${pin}<div class="macd-bar-top"></div><div class="macd-bar-bot">${bar}</div></div>`;
  }).join('');
}

function etfMacdHtml() {
  const t = ETF_TRACK;
  if (!t || !t.bars) return `<div class="etf-empty">加载中…</div>`;
  const bars = t.bars;
  const last = bars[bars.length - 1] || {};
  const difCls = last.dif >= 0 ? 'pos' : 'neg';
  return `
    <div class="etf-macd macd-chart-wrap" style="height:52px;margin:22px 0 22px">
      <div class="macd-zero-line"></div>
      <div class="macd-bars">${etfMacdBarsHtml(bars)}</div>
    </div>
    <div class="etf-legend">
      <span>DIF <b style="color:${last.dif >= 0 ? '#e84c3d' : '#2ebd85'}">${last.dif >= 0 ? '+' : ''}${(last.dif ?? 0).toFixed(3)}</b></span>
      <span>DEA <b style="color:${last.dea >= 0 ? '#e84c3d' : '#2ebd85'}">${last.dea >= 0 ? '+' : ''}${(last.dea ?? 0).toFixed(3)}</b></span>
      <span>MACD 柱 <b style="color:${last.bar >= 0 ? '#e84c3d' : '#2ebd85'}">${last.bar >= 0 ? '+' : ''}${(last.bar ?? 0).toFixed(3)}</b></span>
    </div>`;
}

// ── 溢价率走势 ──
function etfPremiumChartHtml() {
  const t = ETF_TRACK;
  const p = t && t.premium;
  const all = p && p.history;
  const h = all ? (ETF_PREMIUM_RANGE === 'all' ? all : all.slice(-120)) : null;
  if (!h || h.length < 3) return `<div class="etf-empty">溢价率历史不足</div>`;
  const W = etfChartWidth(), H = 124, PL = 32, PR = 10, PT = 10, PB = 16;
  const vals = h.map(x => x.premium);
  const avg = p.stats20 ? p.stats20.avg20 : null;
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (avg != null) { lo = Math.min(lo, avg); hi = Math.max(hi, avg); }
  if (!(hi > lo)) hi = lo + 1;
  const pad = (hi - lo) * 0.15;
  lo -= pad; hi += pad;
  const n = h.length;
  const X = i => PL + (i / (n - 1)) * (W - PL - PR);
  const Y = v => PT + ((hi - v) / (hi - lo)) * (H - PT - PB);
  let grid = '';
  for (let k = 0; k <= 3; k++) {
    const v = lo + (hi - lo) * (k / 3);
    const y = Y(v);
    grid += `<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W - PR}" y2="${y.toFixed(1)}" stroke="var(--etf-grid)" stroke-width="1"/>`
          + `<text x="${PL - 5}" y="${(y + 3.2).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--text-muted)">${v.toFixed(0)}%</text>`;
  }
  // 策略阈值参考线：加仓线 / 买入线 / 警戒线 / 减仓线
  const R = (p.rules || { add: 15, buy: 18, watch: 22, danger: 27 });
  const thrDefs = [
    { v: R.add,    c: '#e84c3d', t: '加仓' },
    { v: R.buy,    c: '#f0752e', t: '买入' },
    { v: R.watch,  c: '#e8a03d', t: '警戒' },
    { v: R.danger, c: '#b8860b', t: '减仓' },
  ];
  let thr = '';
  for (const td of thrDefs) {
    if (!isFinite(td.v) || td.v < lo || td.v > hi) continue;
    const y = Y(td.v);
    thr += `<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W - PR}" y2="${y.toFixed(1)}" stroke="${td.c}" stroke-width="1" stroke-dasharray="3 3" opacity="0.75"/>`
         + `<text x="${W - PR - 1}" y="${(y - 3).toFixed(1)}" text-anchor="end" font-size="8.5" fill="${td.c}">${td.t} ${td.v}%</text>`;
  }
  const line = h.map((x, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(x.premium).toFixed(1)}`).join(' ');
  const area = `${line} L${X(n - 1).toFixed(1)} ${(H - PB).toFixed(1)} L${X(0).toFixed(1)} ${(H - PB).toFixed(1)} Z`;
  const avgLine = avg != null
    ? `<line x1="${PL}" y1="${Y(avg).toFixed(1)}" x2="${W - PR}" y2="${Y(avg).toFixed(1)}" stroke="#e8a03d" stroke-width="1.1" stroke-dasharray="4 3"/>`
    : '';
  const fmtD = d => `${+String(d).slice(5, 7)}/${+String(d).slice(8, 10)}`;
  return `
    <div class="etf-chart-wrap">
      <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="height:124px">
        <defs>
          <linearGradient id="etf-pa" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f0752e" stop-opacity="0.32"/>
            <stop offset="100%" stop-color="#f0752e" stop-opacity="0"/>
          </linearGradient>
        </defs>
        ${grid}${thr}
        <path d="${area}" fill="url(#etf-pa)"/>
        <path d="${line}" fill="none" stroke="#f0752e" stroke-width="1.5"/>
        ${avgLine}
        <text x="${PL + 2}" y="${H - 4}" font-size="9" fill="var(--text-muted)">${fmtD(h[0].date)}</text>
        <text x="${W - PR}" y="${H - 4}" text-anchor="end" font-size="9" fill="var(--text-muted)">${fmtD(h[n - 1].date)}</text>
      </svg>
    </div>
    <div class="etf-legend">
      <span><i style="background:#f0752e"></i>溢价率（按净值口径）</span>
      ${avg != null ? `<span><i style="background:#e8a03d"></i>近20日均值 ${avg}%</span>` : ''}
      ${p.stats20 ? `<span>近20日区间 ${p.stats20.min20}% ~ ${p.stats20.max20}%</span>` : ''}
    </div>
    <div class="etf-legend">
      <span><i style="background:#e84c3d"></i>加仓线 ${R.add}%</span>
      <span><i style="background:#f0752e"></i>买入线 ${R.buy}%</span>
      <span><i style="background:#e8a03d"></i>警戒线 ${R.watch}%</span>
      <span><i style="background:#b8860b"></i>减仓线 ${R.danger}%</span>
    </div>`;
}

// ── 关键指标 ──
function etfMetricsHtml() {
  const t = ETF_TRACK;
  if (!t) return '';
  const i = t.ind || {};
  const q = t.quote || {};
  const f = (v, d = 3) => (v != null && isFinite(v) ? v.toFixed(d) : '—');
  const now = q.price != null ? q.price : i.price;
  const ma = (k, v) => ({ k, v: f(v), tone: (now != null && v != null) ? (now >= v ? 'up' : 'down') : 'flat' });
  const amp = (q.high != null && q.low != null && q.prevClose) ? ((q.high - q.low) / q.prevClose * 100) : null;
  const items = [
    ma('MA5', i.ma5), ma('MA10', i.ma10), ma('MA21', i.ma21), ma('MA60', i.ma60),
    { k: '20日最高', v: f(i.high20), tone: 'flat' },
    { k: '距20日高', v: i.drawdownFromHigh20 != null ? `${i.drawdownFromHigh20.toFixed(2)}%` : '—', tone: i.drawdownFromHigh20 >= 0 ? 'up' : 'down' },
    { k: '20日波动', v: i.vol20 != null ? `${i.vol20.toFixed(1)}%` : '—', tone: 'flat' },
    { k: '今日振幅', v: amp != null ? `${amp.toFixed(2)}%` : '—', tone: 'flat' },
  ];
  return `
    <div class="etf-board-head">
      <span>关键指标</span>
      <span class="sub">价格与均线比较：${now != null ? now.toFixed(3) : '—'}</span>
    </div>
    <div class="etf-metrics compact">${items.map(x => `
    <div class="etf-metric">
      <div class="etf-metric-k">${x.k}</div>
      <div class="etf-metric-v ${x.tone}">${x.v}</div>
    </div>`).join('')}</div>`;
}

// ── 我的持仓 ──
function etfPositionHtml() {
  const pos = etfPosition();
  const t = ETF_TRACK;
  const price = t && t.quote && t.quote.price != null ? t.quote.price : (t && t.ind ? t.ind.price : null);
  const mv = price != null ? pos.shares * price : 0;
  const pnl = pos.shares > 0 ? mv - pos.cost : 0;
  const pnlPct = pos.shares > 0 && pos.cost > 0 ? (pnl / pos.cost) * 100 : 0;
  const f = (v, d = 2) => (v != null && isFinite(v) ? v.toFixed(d) : '—');
  const rows = [...ETF_TRADES].sort((a, b) => (String(b.date) + String(b.id)).localeCompare(String(a.date) + String(a.id))).map(tr => `

      <span class="etf-trade-side ${tr.side}">${tr.side === 'buy' ? '买入' : '卖出'}</span>
      <span>${Number(tr.price).toFixed(3)} × ${Number(tr.shares)}</span>
      <span style="color:var(--text-muted)">¥${(Number(tr.price) * Number(tr.shares)).toFixed(0)}</span>

      <div class="etf-pos-cell"><div class="etf-pos-k">市值</div><div class="etf-pos-v">¥${mv.toFixed(0)}</div></div>
      <div class="etf-pos-cell">
        <div class="etf-pos-k">浮动盈亏</div>
        <div class="etf-pos-v ${pos.shares > 0 ? cls(pnl) : ''}">${pos.shares > 0 ? `${pnl >= 0 ? '+' : ''}${pnl.toFixed(0)}` : '—'}</div>
      </div>
      <div class="etf-pos-cell"><div class="etf-pos-k">收益率</div><div class="etf-pos-v ${pos.shares > 0 ? cls(pnlPct) : ''}">${pos.shares > 0 ? etfPct(pnlPct) : '—'}</div></div>
      <div class="etf-pos-cell"><div class="etf-pos-k">已实现盈亏</div><div class="etf-pos-v ${ETF_TRADES.length ? cls(pos.realized) : ''}">${ETF_TRADES.length ? `${pos.realized >= 0 ? '+' : ''}${pos.realized.toFixed(0)}` : '—'}</div></div>
      <div class="etf-pos-cell"><div class="etf-pos-k">交易笔数</div><div class="etf-pos-v">${ETF_TRADES.length}</div></div>
      <div class="etf-pos-cell"><div class="etf-pos-k">当前价</div><div class="etf-pos-v">${price != null ? price.toFixed(3) : '—'}</div></div>
    </div>
    <div class="etf-trade-form">
      <input id="etf-t-date" class="etf-inp" type="date" value="${todayLocalStr()}">
      <select id="etf-t-side" class="etf-inp side">
        <option value="buy">买入</option>
        <option value="sell">卖出</option>
      </select>
      <input id="etf-t-price" class="etf-inp" type="number" step="0.001" inputmode="decimal" placeholder="价格">
      <input id="etf-t-shares" class="etf-inp" type="number" step="1" inputmode="numeric" placeholder="份额">
      <button class="etf-btn primary" onclick="etfAddTrade()">记录</button>

    <div class="etf-trade-form" style="border-top:none;margin-top:2px;padding-top:0">
      <button class="etf-btn" onclick="etfFillPrice()">填入现价</button>

      <button class="etf-btn" onclick="etfToggleSound()">${ETF_SOUND ? '🔔 提示音已开' : '🔕 提示音已关'}</button>
    </div>
    ${rows ? `<div class="etf-trades">${rows}</div>` : `<div class="etf-empty" style="padding:8px 0">还没有交易记录，添加后会据此给出持仓相关的建议</div>`}`;
}

function etfAddTrade() {
  const side = (document.getElementById('etf-t-side') || {}).value || 'buy';
  const date = ((document.getElementById('etf-t-date') || {}).value || '').trim() || todayLocalStr();
  const price = parseFloat((document.getElementById('etf-t-price') || {}).value);
  const shares = parseFloat((document.getElementById('etf-t-shares') || {}).value);
  if (!isFinite(price) || price <= 0 || !isFinite(shares) || shares <= 0) {
    etfToast({ level: 'warn', title: '无法记录', text: '请填写有效的价格与份额（均为正数）', time: nowStr() });
    return;
  }
  ETF_TRADES.push({ id: Date.now(), date, side, price, shares });
  etfSaveTrades();
  const pi = document.getElementById('etf-t-price');
  const si = document.getElementById('etf-t-shares');
  if (pi) pi.value = '';
  if (si) si.value = '';
  renderEtfPosition();
  loadEtfTrack().then(() => { updateEtfLive(); });
}

function renderDetail(idx, mode) {
  const fund = FUNDS[idx];
  const map = LAST_MAP;
  const fxChg = map['USDCNY=X']?.regularMarketChangePercent ?? 0;
  const opts = mode === '24h' ? { mode: '24h' } : {};
  const est = calcFund(fund, map, fxChg, opts);

  const sorted = [...(fund.holdings || [])].sort((a, b) => b.w - a.w);
  const visible = expanded ? sorted : sorted.slice(0, 10);
  const hasMore = sorted.length > 10;

  const rowsHtml = visible.map(h => {
    const isUs = isUSHolding(h);
    const q = isUs ? map[h.s] : null;
    const chg = q ? effectiveChange(q, opts) : null;
    const approx = !!(mode === '24h' && q && q.marketState === 'OVERNIGHT' && q.overnightEstimated);
    // 休市（节假日/周末）：该市场今日无交易，涨幅按 0 计，并标注出来避免误解
    const closed = !!(q && q.tradingToday === false);
    const closedTip = closed ? `该市场今日休市，涨幅按 0 计（行情源最近报价日 ${q.sessionDate}）` : '';
    // 日韩股收盘估值按「昨日涨跌幅」计（QDII 净值 T+2 滞后，昨日行情尚未计入净值）
    const ydayTip = (mode !== '24h' && q && q.yesterdayChangePercent != null)
      ? `日韩股按昨日(${q.yesterdayDate})涨跌幅计：QDII净值T+2滞后，昨日行情尚未计入最新净值` : '';
    // 夜盘实测值：夜盘尾声成交稀少，数据可能滞后数十分钟，标注成交时间避免被误读为实时
    const nightAsOf = (mode === '24h' && !approx && q && q.marketState === 'OVERNIGHT' && q.overnightAsOf)
      ? q.overnightAsOf : null;
    const nightTip = nightAsOf
      ? `夜盘成交价（富途同源口径），数据时间 ${fmtEtHm(nightAsOf)}${q.overnightLagMin > 1 ? `，约 ${q.overnightLagMin} 分钟前` : ''}`
      : '';
    const chgTip = approx ? '夜盘实时源暂不可用，此值为模型估算' : (nightTip || closedTip || ydayTip);
    const tag = marketTag(h.market);
    return `
      <div class="holding-row">
        <span class="holding-name">${holdingDisplayName(h)}${tag ? `<span class="holding-mkt-tag">${tag}</span>` : ''}${closed ? `<span class="holding-closed-tag" title="${closedTip}">休市</span>` : ''}</span>
        <span class="holding-weight">${(h.w * 100).toFixed(2)}%</span>
        <span class="holding-chg ${cls(chg)}"${chgTip ? ` title="${chgTip}"` : ''}>${fmtPct(chg)}</span>
      </div>`;
  }).join('');

  const expandHtml = (hasMore && !expanded)
    ? `<button class="retry-btn" style="display:block;width:100%;margin:0;padding:16px;border-radius:0;border:none;border-bottom:1px solid var(--border);background:transparent;color:var(--text-name);font-size:14px" onclick="expandAll()">展开全部数据 (${sorted.length})</button>`
    : '';

  const qDate = fund.reportDate || '';
  const yDate = fund.annualDate || '';
  const coveragePct = ((Number(fund.coverageWeight) || sorted.reduce((s, h) => s + h.w, 0)) * 100).toFixed(1);
  let noteText;
  if (qDate && yDate && qDate !== yDate) {
    noteText = `基于 ${qDate} 最新报告结合 ${yDate} 中报/年报持仓计算, 披露覆盖 ${coveragePct}%, 剩余权重用指数代理, 共 ${sorted.length} 支`;
  } else if (qDate) {
    noteText = `基于 ${qDate} 最新报告持仓计算, 披露覆盖 ${coveragePct}%, 剩余权重用指数代理, 共 ${sorted.length} 支`;
  } else {
    noteText = `基于公开披露持仓计算, 披露覆盖 ${coveragePct}%, 剩余权重用指数代理, 共 ${sorted.length} 支`;
  }

  const mktLabel24h = mode === '24h' ? us24hSession() : '';

  document.getElementById('app').innerHTML = `
    <div class="detail-topbar">
      <button class="back-btn" onclick="goBack()">‹ 返回</button>
      <div class="detail-title">
        <div>${fund.name}</div>
        <div style="font-size:11px;color:var(--detail-code);font-weight:400;margin-top:2px;">${fund.code || ''}</div>
      </div>
      <div class="detail-est">
        <span class="est-label">${mode === '24h' ? mktLabel24h + ':' : '估值:'}</span><span class="${cls(est)}">${fmtPct(est)}</span>
      </div>
    </div>
    <div class="table-head">
      <span class="col-name">名称</span>
      <span class="col-pct">占比</span>
      <span class="col-chg">涨跌幅</span>
    </div>
    ${rowsHtml}
    ${expandHtml}
    <div class="detail-footnote">${noteText}</div>
  `;
}

function rerender() {
  const r = currentRoute();
  if (r.view === 'detail') renderDetail(r.idx, r.mode);
  else if (r.view === '24h') render24h();
  else if (r.view === 'history') renderHistory();
  else if (r.view === 'macd') renderMacdView();
  else if (r.view === 'etf') {
    // 已在视图内则只刷新动态区块（避免 10 秒重绘打断输入）；跨交易日或首次进入才整页渲染
    const tradingDate = ETF_TRACK && ETF_TRACK.session ? ETF_TRACK.session.lastTradingDate : null;
    if (!document.getElementById('etf-hero') || ETF_RENDERED_DATE !== tradingDate) {
      renderEtfView();
    } else {
      updateEtfLive();
    }
    // 直接以 #/etf 打开时数据尚未加载，这里主动拉一次
    if (!ETF_TRACK && !ETF_LOADING) {
      loadEtfTrack().then(() => { if (currentRoute().view === 'etf') rerender(); });
    }
  }
  else if (r.view === 'list' && usMarketTrading()) render24h();  // QDII tab：北京时间16:00后 → 24h视图
  else renderList();
}

  try {

    const json = await r.json();
    if (!json.success) return;
    ddMap = {};
    for (const item of (json.data || [])) {
      if (item.maxDD != null) ddMap[item.code] = item.maxDD;
    }
  } catch (e) { /* 静默失败，不影响主页面 */ }
}

async function loadHistoryData() {
  if (historyData) return;
  try {
    const r = await fetch('/api/fund-history');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const json = await r.json();
    if (!json.success) throw new Error(json.error || 'fund-history failed');
    historyData = json.data || [];
    renderHistory();
  } catch (e) {
    document.getElementById('app').innerHTML = `
      <div style="padding:14px"><button class="back-btn" onclick="goBack()">‹ 返回</button></div>
      <div class="center-msg"><span style="color:var(--text-muted)">数据加载失败: ${e.message}</span>
      <button class="retry-btn" onclick="historyData=null;loadHistoryData()">重试</button></div>`;
  }
}

function toggleHistorySort() {
  historySortMode = historySortMode === 'default' ? 'desc'
                 : historySortMode === 'desc' ? 'asc' : 'default';
  renderHistory();
}

function setHistoryPeriod(p) {
  historyPeriod = p;
  historySortMode = 'desc'; // 切换周期时重置排序
  renderHistory();
}

function renderHistory() {
  const map = LAST_MAP;
  const mktLabel = marketLabel(map);

  // 如果数据还没加载，显示 loading
  if (!historyData) {
    document.getElementById('app').innerHTML = `
      <div style="padding:14px 14px 0"><button class="back-btn" onclick="goBack()">‹ 返回</button></div>
      <div class="header">
        <div class="h-item"><div class="h-label">纳斯达克</div><div class="h-val flat">--</div></div>
        <div class="h-item"><div class="h-label">纳指100(QQQ)</div><div class="h-val flat">--</div></div>
        <div class="h-item"><div class="h-label">标普500(SPY)</div><div class="h-val flat">--</div></div>
        <div class="h-item"><div class="h-label">汇率</div><div class="h-val flat">--</div></div>
      </div>
      <div class="history-loading"><div class="spinner"></div><span>加载净值历史…</span></div>`;
    loadHistoryData();
    return;
  }

  const ixicChg = effectiveChange(map['IXIC']);
  const qqqChg  = effectiveChange(map['QQQ']);
  const spyChg  = effectiveChange(map['SPY']);
  const fxChg   = map['USDCNY=X']?.regularMarketChangePercent ?? 0;

  // 根据当前周期取涨跌幅字段
  const periodKey = historyPeriod === 15 ? 'd15' : historyPeriod === 30 ? 'd30' : 'd60';

  // 日期区间：今天往前推 N 天
  function fmtDateCompact(d) {
    return d.getFullYear().toString()
      + String(d.getMonth() + 1).padStart(2, '0')
      + String(d.getDate()).padStart(2, '0');
  }
  const dateEnd   = new Date();
  const dateStart = new Date(dateEnd.getTime() - historyPeriod * 24 * 3600 * 1000);
  const dateRangeStr = `${fmtDateCompact(dateStart)} - ${fmtDateCompact(dateEnd)}`;

  // 排序
  let sortedData = [...historyData];
  if (historySortMode === 'desc') {
    sortedData.sort((a, b) => (b[periodKey] ?? -999) - (a[periodKey] ?? -999));
  } else if (historySortMode === 'asc') {
    sortedData.sort((a, b) => (a[periodKey] ?? -999) - (b[periodKey] ?? -999));
  }

  let rows = '';
  sortedData.forEach(item => {
    const chg = item[periodKey];
    rows += `
      <div class="fund-item">
        <div class="fund-left">
          <span class="fund-name">${item.name}</span>
          <span class="badge">${item.code}</span>
        </div>
        <span class="fund-pct ${cls(chg)}">${fmtPct(chg)}</span>
      </div>`;
  });

  const dotClass = LAST_STALE ? 'dot' : 'dot live';

  document.getElementById('app').innerHTML = `
    <div style="padding:10px 14px 0;background:var(--bg-header)"><button class="back-btn" onclick="goBack()">‹ 返回</button></div>
    <div class="header">
      <div class="h-item">
        <div class="h-label">纳斯达克</div>
        <div class="h-val ${cls(ixicChg)}">${fmtPct(ixicChg)}</div>
      </div>
      <div class="h-item">
        <div class="h-label">纳指100(QQQ)</div>
        <div class="h-val ${cls(qqqChg)}">${fmtPct(qqqChg)}</div>
      </div>
      <div class="h-item">
        <div class="h-label">标普500(SPY)</div>
        <div class="h-val ${cls(spyChg)}">${fmtPct(spyChg)}</div>
      </div>
      <div class="h-item">
        <div class="h-label">汇率</div>
        <div class="h-val ${cls(fxChg)}">${fmtPct(fxChg)}</div>
      </div>
    </div>
    <div class="status-bar">基于天天基金净值历史计算&ensp;更新于 ${nowStr()}(<span class="mkt">${mktLabel}</span>)<span class="${dotClass}"></span>
    </div>
    <div class="history-date-range">统计区间：${dateRangeStr}</div>
    <div class="history-toolbar">
      <span class="period-btn ${historyPeriod === 15 ? 'active' : ''}" onclick="setHistoryPeriod(15)">近15天</span>
      <span class="period-btn ${historyPeriod === 30 ? 'active' : ''}" onclick="setHistoryPeriod(30)">近30天</span>
      <span class="period-btn ${historyPeriod === 60 ? 'active' : ''}" onclick="setHistoryPeriod(60)">近60天</span>
      <span class="sort-header history-sort ${historySortMode !== 'default' ? 'active' : ''}" onclick="toggleHistorySort()">涨跌幅<span class="sort-arrows"><span class="arr ${historySortMode === 'asc' ? 'on' : ''}">▲</span><span class="arr ${historySortMode === 'desc' ? 'on' : ''}">▼</span></span></span>
    </div>
    <div class="fund-list">${rows}</div>
    <div class="footer">数据来源：天天基金（净值历史）<br>净值数据每日更新</div>
  `;
}

function renderError(msg) {
  document.getElementById('app').innerHTML = `
    <div class="center-msg">
      <span style="color:var(--text-muted)">数据加载失败</span>
      <span style="font-size:11px;color:var(--text-footer)">${msg}</span>
      <button class="retry-btn" onclick="bootstrap()">重试</button>
    </div>`;
}

// ═══════════════════════════════════════════════════
//  MAIN — bootstrap + polling loop
// ═══════════════════════════════════════════════════
async function pollLoop() {
  try {
    const { map, stale } = await fetchQuotes();
    LAST_MAP = map;
    LAST_STALE = stale;
  } catch (e) {
    console.error('quotes poll failed:', e);
  }
  // 纳指科技ETF 跟踪数据：在视图内每轮刷新；其他 Tab 下最多 30 秒一次
  // （盘中提示需要在任何 Tab 下都能触发，所以做了后台节流刷新）
  try {
    const onEtf = currentRoute().view === 'etf';
    if (onEtf || Date.now() - etfLastLoadTs > 30000) {
      etfLastLoadTs = Date.now();
      await loadEtfTrack();
    }
  } catch (e) {
    console.error('etf-track poll failed:', e);
  }
  rerender();
  clearTimeout(timer);
  timer = setTimeout(pollLoop, 10000);
}

async function bootstrap() {
  try {
    const funds = await fetchFunds();
    if (!funds.length) throw new Error('基金列表为空');
    FUNDS = funds.filter(f => f && (f.name || f.code));
    if (!FUNDS.length) throw new Error('未获取到任何持仓数据');
    fetchAshareMa();   // 非阻塞加载A股MA数据
    fetchIndexMa();    // 非阻塞加载四大指数均线预警
    fetchIndexMacd();  // 非阻塞加载四大指数MACD数据
    loadDrawdownData(); // 非阻塞加载近一年最大回撤
    await pollLoop();
  } catch (e) {
    renderError(e.message);
  }
}

// expose globals for inline onclick
window.go = go;
window.goBack = goBack;
window.expandAll = expandAll;
window.bootstrap = bootstrap;
window.toggleSort = toggleSort;
window.togglePin = togglePin;
window.setHistoryPeriod = setHistoryPeriod;
window.toggleHistorySort = toggleHistorySort;
window.toggleMacdSection = toggleMacdSection;
window.etfToggleSignals = etfToggleSignals;
window.etfToggleAlerts = etfToggleAlerts;
window.etfToggleAlertLog = etfToggleAlertLog;
window.etfAddTrade = etfAddTrade;
window.etfDelTrade = etfDelTrade;
window.etfFillPrice = etfFillPrice;
window.etfToggleNotify = etfToggleNotify;
window.etfToggleSound = etfToggleSound;

bootstrap();
</script>
